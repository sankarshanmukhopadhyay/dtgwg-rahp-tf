- id: RKP-PE-02
  name: Failure cost externalization
  family: Political economy
  description: Operators or intermediaries capture benefits while harmed participants bear disproportionate remediation,
    exclusion or liability costs.
  harm_patterns:
  - HRM-ECO-01
  - HRM-ECO-02
  - HRM-GOV-02
  origin: ecosystem
  scope: systemic
  temporal_mode: immediate
  reversibility: costly
  observability: detectable
  applicability: {}
  related_patterns: []
  guardrail_requirement:
    status: conditional
    rationale: Failure costs are not always avoidable. A guardrail is required when affected people cannot reasonably
      choose, exit or seek remedy.
    condition: Applies to high-impact or involuntary use where materially affected parties lack meaningful choice,
      exit or remedy.
