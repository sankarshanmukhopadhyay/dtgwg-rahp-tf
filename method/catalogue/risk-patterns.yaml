records:
- id: RKP-AUTH-01
  name: Possession mistaken for authority
  family: Authority and delegation
  description: Authentication, key possession or identity proof is treated as sufficient evidence that the actor
    is authorized for the requested action.
  harm_patterns:
  - HRM-AUT-04
  - HRM-SEC-02
  - HRM-INF-01
  origin: design
  scope: cross-party
  temporal_mode: immediate
  reversibility: costly
  observability: detectable
  applicability: {}
  related_patterns: []
  guardrail_requirement:
    status: required
    rationale: This risk can create an unacceptable state at a clear decision or execution boundary, so a portable
      guardrail should block or stop that state.
    condition: null
