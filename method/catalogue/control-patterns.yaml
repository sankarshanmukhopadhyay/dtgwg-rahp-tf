- id: CTP-ID-03
  name: Explicit uniqueness assurance
  control_function: constrain
  control_objective: Where uniqueness is required, define the population, assurance mechanism, false-positive/false-negative
    limits and non-uniqueness fallback explicitly.
  risk_patterns:
  - RKP-ID-02
  authority: deployment governance
  enforcement_point: identity/admission boundary
  activation: before a decision relies on uniqueness
  failure_behavior: do not infer uniqueness; use a lower-assurance or alternate path
  audit_events:
  - uniqueness-evaluated
  evidence_patterns:
  - EVP-RISK-01
  introduces_or_amplifies_risks:
  - RKP-EXC-02
  - RKP-PRV-01
