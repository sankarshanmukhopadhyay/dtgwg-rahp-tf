  audit_events:
  - control-evaluated
  - control-failed-or-overridden
  evidence_patterns:
  - EVP-AUTH-02
  introduces_or_amplifies_risks: []
- id: CTP-DEL-01
  name: Delegation chain continuity
  control_function: constrain
  control_objective: Preserve the originating principal and bounded authority envelope across each delegation hop.
