term: Evidence pattern
slug: evidence-pattern
status: stable
definition: A reusable description of what evidence should be produced, who produces it, how fresh it
  must be and when it becomes invalid.
plain_example: A revocation propagation trace records when each enforcement point learned about a revocation.
