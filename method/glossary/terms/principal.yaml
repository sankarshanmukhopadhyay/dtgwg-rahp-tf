term: Principal
slug: principal
status: stable
definition: The person or organization whose authority, interests or instructions an agent or delegate
  is expected to serve.
plain_example: A traveller is the principal when a personal agent books on the traveller’s behalf.
term_type: rahp-native
scope: general
