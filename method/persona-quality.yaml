version: 1
purpose: >-
  Defines non-demographic richness gates for RAHP personas. The base JSON Schema
  describes valid record shape; this profile describes whether a portable role is
  sufficiently rich to function as a harms and assurance pressure-test instrument.
profiles:
  portable_role:
    required_fields:
      - context
      - goals
      - risk_context
      - power_and_decisions
      - harms_and_externalities
      - inclusion_drivers
      - exclusion_risks
      - pressure_test_situations
      - evidence
      - lifecycle_phases
    minimum_items:
      goals: 4
      risk_context: 5
      power_and_decisions: 3
      harms_and_externalities: 3
      inclusion_drivers: 3
      exclusion_risks: 3
      pressure_test_situations: 3
      evidence: 1
      lifecycle_phases: 2
    context_required_keys:
      - operating_context
      - authority_position
      - dependencies
    prohibited_lifecycle_only_values:
      - Cross-domain
