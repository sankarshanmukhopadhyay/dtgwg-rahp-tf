version: 1
development_target: 1.5.0
capabilities:
  - id: assurance-lineage
    roadmap_term: Durable assessment and finding lineage
    schemas:
      - method/schema/assessment-lineage.schema.json
      - method/schema/finding-lineage.schema.json
    tools:
      - tools/validate_assurance_lineage.py
    tests: []
    documentation: docs/assurance-lineage.md
    required_terms:
      - assessment identity
      - finding-lineage
      - canonical identity
  - id: remediation-retest
    roadmap_term: Governed remediation and retest
    schemas:
      - method/schema/remediation-manifest.schema.json
      - method/schema/retest.schema.json
    tools:
      - tools/retest.py
      - tools/validate_remediation_retest_lineage.py
    tests:
      - tests/test_remediation_retest_lineage.py
    documentation: docs/remediation-lifecycle.md
    required_terms:
      - acceptance criteria
      - closure evidence
      - authority
  - id: assurance-graph-impact
    roadmap_term: Assurance graph and impact analysis
    schemas:
      - method/schema/assurance-graph.schema.json
      - method/schema/impact-analysis.schema.json
    tools:
      - tools/impact.py
      - tools/validate_assurance_graph.py
    tests:
      - tests/test_assurance_graph_impact.py
    documentation: docs/assurance-graph-impact.md
    required_terms:
      - impact
      - retest_required
      - reachability
  - id: evidence-freshness-delta
    roadmap_term: Evidence provenance, freshness and delta
    schemas:
      - method/schema/evidence-manifest.schema.json
      - method/schema/assurance-freshness.schema.json
      - method/schema/assurance-delta.schema.json
    tools:
      - tools/assurance_state.py
      - tools/validate_evidence_freshness_delta.py
    tests:
      - tests/test_evidence_freshness_delta.py
    documentation: docs/evidence-freshness-delta.md
    required_terms:
      - evidence provenance
      - retest-required
      - assurance delta
  - id: authority-policy-gates
    roadmap_term: Executable authority and policy gates
    schemas:
      - method/schema/authority.schema.json
      - method/schema/gate-policy.schema.json
    tools:
      - tools/authority.py
      - tools/policy_gate.py
      - tools/validate_authority_policy_gates.py
    tests:
      - tests/test_authority_policy_gates.py
    documentation: docs/authority-policy-gates.md
    required_terms:
      - revocable
      - INDETERMINATE
      - accept-risk
      - policy evaluation
  - id: portfolio-presentation
    roadmap_term: Portfolio and deployment presentation
    schemas:
      - method/schema/assurance-posture.schema.json
    tools:
      - tools/assurance_posture.py
      - tools/validate_v15_release.py
    tests:
      - tests/test_assurance_posture.py
    documentation: docs/assurance-posture.md
    required_terms:
      - assurance score
      - gate_blocked
      - authority_blocked
      - operational posture
  - id: release-qualification
    roadmap_term: Release qualification
    schemas: []
    tools:
      - tools/validate_v15_release.py
    tests:
      - tests/test_v15_release_qualification.py
    documentation: docs/v1.5-release-runbook.md
    required_terms:
      - qualification contract
      - random
      - release decision
      - release-cut commit
