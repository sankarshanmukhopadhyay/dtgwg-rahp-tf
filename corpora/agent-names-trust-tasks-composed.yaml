      - ATP-COMP-01
      - ATP-AUTH-02
      evidence_patterns:
      - EVP-COMP-01
      - EVP-AUTH-01
  - id: XSP-AT-XS-002
    title: Agent controller changes while an existing task remains executable
    domain: Cross-spec / lifecycle
    primary_goal: Bind task authority to current controller state
