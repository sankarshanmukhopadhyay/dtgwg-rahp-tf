    title: Resolvable agent name is treated as task authority
    domain: Cross-spec / authority
    primary_goal: Separate agent naming from delegated mandate
    primary_pressure: Name-to-authority substitution
    priority: P1
    scenario_patterns:
    - SP-DEL-01
    - SP-COMP-01
    portable_assurance:
      harm_patterns:
      - HRM-SEC-02
      - HRM-INF-01
