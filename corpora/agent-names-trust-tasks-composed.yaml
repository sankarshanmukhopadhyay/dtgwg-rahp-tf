corpus:
  id: CORPUS-AGENTNAMES-TT-COMPOSED
  title: "Agent Names \xD7 Trust Tasks composed scenario corpus"
  adapter_version: '1.0'
  description: "RAHP-authored cross-specification scenarios for the Agent Names \xD7 Trust Tasks seam. These XSP IDs are RAHP\
    \ assessment artefacts, not upstream identifiers."
  evidence_grade: scenario-baseline
  depends_on:
  - corpus_id: CORPUS-DTG-AGENT-NAMES
  - corpus_id: CORPUS-TRUST-TASKS
  assurance_catalogue: method/catalogue/
  scenarios:
