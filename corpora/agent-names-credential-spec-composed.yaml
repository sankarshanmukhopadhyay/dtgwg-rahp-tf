corpus:
  id: CORPUS-AGENTNAMES-CREDSPEC-COMPOSED
  title: "Agent Names \xD7 DTG Credential Specification composed scenario corpus"
  adapter_version: '1.0'
  description: "RAHP-authored cross-specification scenarios for the Agent Names \xD7 DTG Credential Specification seam. These\
    \ XSP IDs are RAHP assessment artefacts, not upstream identifiers."
  evidence_grade: scenario-baseline
  depends_on:
  - corpus_id: CORPUS-DTG-AGENT-NAMES
  - corpus_id: CORPUS-DTG-CREDSPEC
  assurance_catalogue: method/catalogue/
  scenarios:
  - id: XSP-AC-001
    title: Agent name is treated as credential subject control
    domain: Cross-spec / identity
    primary_goal: Separate identifier resolution from subject/controller control
    primary_pressure: Control substitution
    priority: P1
    scenario_patterns:
    - SP-AUTH-01
    - SP-COMP-01
    portable_assurance:
      harm_patterns:
      - HRM-SEC-02
      - HRM-INF-01
      - HRM-AUT-04
      - HRM-GOV-02
      risk_patterns:
      - RKP-COMP-01
      - RKP-AUTH-02
      control_patterns:
      - CTP-COMP-01
      - CTP-AUTH-02
      guardrail_patterns:
      - GRP-COMP-01
      - GRP-AUTH-02
      assurance_patterns:
      - ATP-COMP-01
      - ATP-AUTH-02
      evidence_patterns:
      - EVP-COMP-01
      - EVP-AUTH-01
  - id: XSP-AC-002
    title: Credential remains valid after agent name changes controller
    domain: Cross-spec / lifecycle
    primary_goal: Reconcile credential lifecycle with name-controller changes
    primary_pressure: Controller lifecycle mismatch
