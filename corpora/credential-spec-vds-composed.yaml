      - ATP-AUTH-02
      evidence_patterns:
      - EVP-COMP-01
      - EVP-AUTH-01
  - id: XSP-CV-003
    title: Credential revocation does not propagate to derived graph relationships
    domain: Cross-spec / lifecycle
    primary_goal: Require revocation propagation or explicit stale-state signalling
    primary_pressure: Revocation lag
    priority: P0
    scenario_patterns:
