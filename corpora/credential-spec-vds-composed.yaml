corpus:
  id: CORPUS-CREDSPEC-VDS-COMPOSED
  title: "DTG Credential Specification \xD7 VDS composed scenario corpus"
  adapter_version: '1.0'
  description: "RAHP-authored cross-specification scenarios for the DTG Credential Specification \xD7 VDS seam. These XSP\
    \ IDs are RAHP assessment artefacts, not upstream identifiers."
  evidence_grade: scenario-baseline
  depends_on:
  - corpus_id: CORPUS-DTG-CREDSPEC
  - corpus_id: CORPUS-DTG-VDS
  assurance_catalogue: method/catalogue/
  scenarios:
  - id: XSP-CV-001
    title: Expired credential assertion remains active in persistent graph state
    domain: Cross-spec / lifecycle
    primary_goal: Reconcile credential expiry with persistent VDS state
    primary_pressure: Lifecycle mismatch
    priority: P0
    scenario_patterns:
    - SP-COMP-02
    - SP-COMP-01
    portable_assurance:
      harm_patterns:
      - HRM-SEC-02
      - HRM-INF-01
      - HRM-AUT-04
      - HRM-GOV-02
      risk_patterns:
      - RKP-COMP-01
      - RKP-AUTH-02
      control_patterns:
      - CTP-COMP-01
      - CTP-AUTH-02
      guardrail_patterns:
      - GRP-COMP-01
      - GRP-AUTH-02
      assurance_patterns:
      - ATP-COMP-01
      - ATP-AUTH-02
      evidence_patterns:
      - EVP-COMP-01
      - EVP-AUTH-01
  - id: XSP-CV-002
    title: Graph edge is treated as current issuer authority without provenance
    domain: Cross-spec / authority
    primary_goal: Keep graph presence separate from authority
    primary_pressure: Authority substitution
    priority: P0
    scenario_patterns:
    - SP-AUTH-02
