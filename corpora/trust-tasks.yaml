corpus:
  id: CORPUS-TRUST-TASKS
  title: Trust Tasks scenario corpus
  source_repository: trustoverip/dtgwg-trust-tasks-tf
  source_path: SPEC.md
  source_commit: archive-snapshot
  adapter_version: '1.0'
  description: Scenario adapter derived from the current Trust Tasks Framework, emphasizing identity, proof, replay, versioning,
    transport, privacy, delegation and error semantics.
  scenarios:
  - id: TT-001
    title: Proof omitted because transport is assumed sufficient
    domain: Trust Tasks / proof
    primary_goal: Rely on transport-level integrity without losing end-to-end evidence
    primary_pressure: Transport/proof boundary
    priority: P0
    scenario_patterns:
    - SP-AUTH-01
    - SP-INTEROP-01
    source_anchor: SPEC.md#471-when-to-include-a-proof
  - id: TT-002
    title: Proof-bearing document lacks safe audience binding
    domain: Trust Tasks / identity
    primary_goal: Bind a signed task to its intended recipient
    primary_pressure: Cross-recipient replay
    priority: P0
    scenario_patterns:
    - SP-REPLAY-01
    - SP-AUTH-01
    source_anchor: SPEC.md#482-audience-binding
  - id: TT-003
    title: In-band and transport-derived identities disagree
    domain: Trust Tasks / identity
    primary_goal: Resolve party identity without confused-deputy behavior
    primary_pressure: Identity precedence
    priority: P0
    scenario_patterns:
    - SP-AUTH-01
    - SP-INTEROP-01
    source_anchor: SPEC.md#481-precedence-of-in-band-over-transport-derived-identity
  - id: TT-004
    title: Expired task is acted on after clock or queue delay
    domain: Trust Tasks / lifecycle
    primary_goal: Prevent stale authorization or action
    primary_pressure: Freshness and expiry
    priority: P0
    scenario_patterns:
    - SP-REPLAY-01
    - SP-OPS-01
    source_anchor: SPEC.md#42-top-level-members
  - id: TT-005
    title: Retried task causes duplicate side effects
    domain: Trust Tasks / errors
    primary_goal: Retry safely after failure
    primary_pressure: Duplicate action
    priority: P0
    scenario_patterns:
    - SP-REPLAY-01
    source_anchor: SPEC.md#84-retry-semantics
  - id: TT-006
    title: Thread and parent-thread binding is inconsistent across transports
    domain: Trust Tasks / composition
    primary_goal: Preserve exchange lineage
    primary_pressure: Conversation binding
    priority: P1
    scenario_patterns:
    - SP-COMP-01
    - SP-INTEROP-01
    source_anchor: SPEC.md#49-the-threadid-member
  - id: TT-007
    title: Ceremony membership is mistaken for authorization
    domain: Trust Tasks / governance
    primary_goal: Keep workflow membership separate from authority
    primary_pressure: Confused deputy
    priority: P0
    scenario_patterns:
    - SP-AGENT-01
    - SP-GOV-02
    source_anchor: SPEC.md#4114-membership-is-a-claim-not-a-permission
  - id: TT-008
    title: Bearer specification is used where recipient binding is necessary
    domain: Trust Tasks / privacy
    primary_goal: Limit bearer semantics to justified cases
    primary_pressure: Unbounded audience
    priority: P0
    scenario_patterns:
    - SP-PRIV-01
    - SP-REPLAY-01
    source_anchor: SPEC.md#483-bearer-specifications
  - id: TT-009
    title: Capability discovery leaks sensitive supported operations
    domain: Trust Tasks / privacy
    primary_goal: Negotiate capabilities without unnecessary disclosure
    primary_pressure: Capability fingerprinting
    priority: P1
    scenario_patterns:
    - SP-PRIV-01
    - SP-SCALE-01
    source_anchor: SPEC.md#115-privacy-considerations
  - id: TT-010
    title: Different framework versions produce divergent acceptance
    domain: Trust Tasks / versioning
    primary_goal: Migrate task versions without ambiguity
    primary_pressure: Version skew
    priority: P0
    scenario_patterns:
    - SP-GOV-02
    - SP-INTEROP-01
    source_anchor: SPEC.md#5-versioning
  - id: TT-011
    title: Transport binding weakens framework security assumptions
    domain: Trust Tasks / transport
    primary_goal: Preserve equivalent guarantees across bindings
    primary_pressure: Binding downgrade
    priority: P0
    scenario_patterns:
    - SP-INTEROP-01
    - SP-CRYPTO-01
    source_anchor: SPEC.md#9-transport-bindings
  - id: TT-012
    title: Error response discloses party or task information
    domain: Trust Tasks / privacy
    primary_goal: Report failure without unnecessary identity leakage
    primary_pressure: Error-channel leakage
    priority: P1
    scenario_patterns:
    - SP-PRIV-01
    source_anchor: SPEC.md#104-error-response-identity-leakage
  - id: TT-013
    title: Large or adversarial payload causes validation denial of service
    domain: Trust Tasks / operations
    primary_goal: Keep parsing and schema validation bounded
    primary_pressure: Resource exhaustion
    priority: P1
    scenario_patterns:
    - SP-INCL-02
    - SP-SCALE-01
    source_anchor: SPEC.md#103-schema-validation-dos
  - id: TT-014
    title: Agent executes a task after principal intent is withdrawn
    domain: Trust Tasks / agents
    primary_goal: Keep delegated action aligned with current mandate
    primary_pressure: Intent drift
    priority: P0
    scenario_patterns:
    - SP-AGENT-01
    - SP-AGENT-02
    source_anchor: SPEC.md#73-specification-requirements
  - id: TT-015
    title: Exposure class understates delegated data egress
    domain: Trust Tasks / governance
    primary_goal: Make confidentiality and agency impact legible
    primary_pressure: Exposure misclassification
    priority: P0
    scenario_patterns:
    - SP-AGENT-01
    - SP-PRIV-01
    source_anchor: SPEC.md#73-specification-requirements
  - id: TT-016
    title: Private or unpublished task type becomes an interoperability island
    domain: Trust Tasks / interoperability
    primary_goal: Allow private extension without unsafe semantic divergence
    primary_pressure: Private namespace drift
    priority: P1
    scenario_patterns:
    - SP-INTEROP-01
    - SP-FED-01
    source_anchor: SPEC.md#65-private-and-unpublished-trust-task-specifications
  source_url: https://github.com/trustoverip/dtgwg-trust-tasks-tf
  source_branch: main
  provenance_status: unverified-archive-snapshot
  provenance_note: Existing adapter predates commit pinning. Review against a concrete source commit before replacing source_commit.
