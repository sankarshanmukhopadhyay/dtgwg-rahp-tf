corpus:
  id: CORPUS-TT-VDS-COMPOSED
  title: "Trust Tasks \xD7 VDS composed scenario corpus"
  adapter_version: '1.0'
  description: "RAHP-authored cross-specification scenarios for the Trust Tasks \xD7 VDS seam. These XSP IDs are RAHP assessment\
    \ artefacts, not upstream identifiers."
  evidence_grade: scenario-baseline
  depends_on:
  - corpus_id: CORPUS-TRUST-TASKS
