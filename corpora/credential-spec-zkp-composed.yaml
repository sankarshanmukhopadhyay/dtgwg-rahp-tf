corpus:
  id: CORPUS-CREDSPEC-ZKP-COMPOSED
  title: "DTG Credential Specification \xD7 ZKP composed scenario corpus"
  adapter_version: '1.0'
  description: "RAHP-authored cross-specification scenarios for the DTG Credential Specification \xD7 ZKP seam. These XSP\
    \ IDs are RAHP assessment artefacts, not upstream identifiers."
  evidence_grade: source-informed
  depends_on:
  - corpus_id: CORPUS-DTG-CREDSPEC
  - corpus_id: CORPUS-DTG-ZKP
  assurance_catalogue: method/catalogue/
  scenarios:
  - id: XSP-CZ-001
    title: Valid predicate proof is treated as proof of issuer authority
    domain: Cross-spec / authority
    primary_goal: Keep cryptographic proof semantics separate from issuer authority
    primary_pressure: Semantic substitution
    priority: P0
    scenario_patterns:
    - SP-AUTH-02
    - SP-COMP-01
    portable_assurance:
      harm_patterns:
      - HRM-SEC-02
      - HRM-INF-01
      - HRM-AUT-04
      - HRM-GOV-02
      risk_patterns:
      - RKP-COMP-01
      - RKP-AUTH-02
      control_patterns:
      - CTP-COMP-01
      - CTP-AUTH-02
      guardrail_patterns:
      - GRP-COMP-01
      - GRP-AUTH-02
      assurance_patterns:
      - ATP-COMP-01
      - ATP-AUTH-02
      evidence_patterns:
      - EVP-COMP-01
      - EVP-AUTH-01
  - id: XSP-CZ-002
    title: Revoked or superseded credential continues to yield an acceptable proof
    domain: Cross-spec / lifecycle
    primary_goal: Bind proof acceptance to current credential lifecycle state
    primary_pressure: Stale evidence
    priority: P0
    scenario_patterns:
    - SP-GOV-01
    - SP-COMP-01
    portable_assurance:
      harm_patterns:
      - HRM-SEC-02
      - HRM-INF-01
      - HRM-AUT-04
      - HRM-GOV-02
      risk_patterns:
      - RKP-COMP-01
      - RKP-AUTH-02
      control_patterns:
      - CTP-COMP-01
      - CTP-AUTH-02
      guardrail_patterns:
      - GRP-COMP-01
      - GRP-AUTH-02
      assurance_patterns:
      - ATP-COMP-01
      - ATP-AUTH-02
      evidence_patterns:
      - EVP-COMP-01
      - EVP-AUTH-01
  - id: XSP-CZ-003
    title: Selective disclosure removes governance context required for reliance
    domain: Cross-spec / privacy
    primary_goal: Retain the minimum governance context needed for safe reliance
    primary_pressure: Context loss
    priority: P0
    scenario_patterns:
    - SP-PRIV-01
    - SP-COMP-01
    portable_assurance:
      harm_patterns:
      - HRM-SEC-02
      - HRM-INF-01
      - HRM-AUT-04
      - HRM-GOV-02
      risk_patterns:
      - RKP-COMP-01
      - RKP-AUTH-02
      control_patterns:
      - CTP-COMP-01
      - CTP-AUTH-02
      guardrail_patterns:
      - GRP-COMP-01
      - GRP-AUTH-02
      assurance_patterns:
      - ATP-COMP-01
      - ATP-AUTH-02
      evidence_patterns:
      - EVP-COMP-01
      - EVP-AUTH-01
  - id: XSP-CZ-004
    title: Proof is replayed outside the relying-party or transaction context
    domain: Cross-spec / replay
    primary_goal: Bind proof use to audience, purpose and freshness
    primary_pressure: Cross-context replay
    priority: P0
    scenario_patterns:
    - SP-REPLAY-01
    - SP-COMP-01
    portable_assurance:
      harm_patterns:
      - HRM-SEC-02
      - HRM-INF-01
      - HRM-AUT-04
      - HRM-GOV-02
