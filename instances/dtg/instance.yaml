version: 1
instance:
  id: dtg
  title: DTG Working Group RAHP instance
  description: 'DTG deployment of the portable RAHP toolkit. Repository scope is discovered
    from the DTG Portfolio Monitor and augmented with forks owned by the configured
    fork owner whose GitHub parent is one of the monitored repositories.

    '
  review_repository: sankarshanmukhopadhyay/rahp-toolkit
portfolio:
  registry_repository: sankarshanmukhopadhyay/dtg-portfolio-monitor
  registry_branch: main
  registry_path: config/repositories.yaml
  fork_owner: sankarshanmukhopadhyay
assessment:
  default_mode: combined
  materiality:
    review_weights:
    - critical
    - high
    include_transitional: true
    always_material_paths:
    - schemas/**
    - specs/**
    - '**/*spec*.md'
    - .github/workflows/**
    documentation_paths:
    - README.md
    - docs/**
    documentation_triage_roles:
    - task-force-workspace
    - legacy-or-transition
    role_profiles:
      normative-specification:
      - README.md
      - docs/**
      - schemas/**
      - specs/**
      - '**/SPEC.md'
      - '**/*spec*.md'
      - .github/workflows/**
      protocol-and-task-specification:
      - README.md
      - SPEC.md
      - bindings/**
      - docs/**
      - schemas/**
      - specs/**
      - '**/*conformance*'
      - '**/tests/**'
      - .github/workflows/**
      implementation-guidance:
      - README.md
      - '*.md'
      - docs/**
      - schemas/**
      - specs/**
      - scripts/**
      - .github/workflows/**
      reference-implementation:
      - README.md
      - docs/**
      - schemas/**
      - specs/**
      - src/**
      - '**/src/**'
      - tests/**
      - '**/tests/**'
      - Cargo.toml
      - '**/Cargo.toml'
      - package.json
      - '**/package.json'
      - .github/workflows/**
      implementation:
      - README.md
      - docs/**
      - src/**
      - '**/src/**'
      - tests/**
      - '**/tests/**'
      - .github/workflows/**
      implementation-and-examples:
      - README.md
      - docs/**
      - src/**
      - '**/src/**'
      - tests/**
      - '**/tests/**'
      - examples/**
      - .github/workflows/**
  issue:
    repository: sankarshanmukhopadhyay/rahp-toolkit
    labels:
    - assessment-required
    - dtg-instance
reviews:
  root: instances/dtg/reviews
state:
  file: instances/dtg/state/repositories.json
generated:
  manifest: instances/dtg/generated/repositories.yaml
