version: 1
issue_repository: sankarshanmukhopadhyay/rahp-toolkit
purpose: >-
  Declared DTG cross-specification assurance seams. RAHP owns execution,
  evidence and review issue publication; source specifications retain authority
  over any upstream remediation.
compositions:
  - id: trust-tasks--credential-spec
    title: Trust Tasks × DTG Credential Specification
    status: maintained
    runnable: true
    priority: P0
    corpus_id: CORPUS-TT-CREDSPEC-COMPOSED
    assessment: examples/cross-spec/trust-tasks-credspec/pressure-test.yaml
    components:
      - repository: trustoverip/dtgwg-trust-tasks-tf
        corpus_id: CORPUS-TRUST-TASKS
        upstream_issue_target: true
      - repository: trustoverip/dtgwg-cred-spec
        corpus_id: CORPUS-DTG-CREDSPEC
        upstream_issue_target: true
    assurance_focus:
      - authority-and-delegation
      - lifecycle-and-revocation
      - replay-and-idempotency
      - privacy-composition
      - redress-and-contestability
  - id: credential-spec--zkp
    title: DTG Credential Specification × ZKP
    status: candidate
    runnable: false
    priority: P0
    components:
      - repository: trustoverip/dtgwg-cred-spec
        upstream_issue_target: true
      - repository: trustoverip/dtgwg-zkp-tf
        upstream_issue_target: true
    assurance_focus: [proof-semantics, authority, lifecycle, privacy-composition]
  - id: credential-spec--vds
    title: DTG Credential Specification × VDS
    status: candidate
    runnable: false
    priority: P0
    components:
      - repository: trustoverip/dtgwg-cred-spec
        upstream_issue_target: true
      - repository: trustoverip/dtgwg-vds-tf
        upstream_issue_target: true
    assurance_focus: [persistent-state, authority, lifecycle, provenance]
  - id: trust-tasks--zkp
    title: Trust Tasks × ZKP
    status: candidate
    runnable: false
    priority: P0
    components:
      - repository: trustoverip/dtgwg-trust-tasks-tf
        upstream_issue_target: true
      - repository: trustoverip/dtgwg-zkp-tf
        upstream_issue_target: true
    assurance_focus: [proof-versus-authority, delegation, replay, freshness]
  - id: trust-tasks--vds
    title: Trust Tasks × VDS
    status: candidate
    runnable: false
    priority: P1
