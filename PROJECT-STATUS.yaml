project: rahp-toolkit
stable_release: 1.2.0
development_target: 1.5.0
release_status: unreleased
qualification_status: cut-ready
qualification_contract: method/v1.5-release-qualification.yaml
compatibility:
  engine_contract: rahp-engine-contract-v1
  normalized_result_schema: 1
  evidence_retention_contract: rahp-evidence-retention-v1
portability:
  invariant: >-
    Portable RAHP method and engine contracts MUST remain independent of any
    deployment, repository host, specification family, implementation, or
    governance community.
  demonstration_policy: >-
    DTG, OpenVTC, ARPA, CAWG/C2PA, and other project-specific assessments MAY
    demonstrate portable capabilities but MUST NOT become dependencies of the
    portable method or core conformance contract.
release_naming:
  applies_from: 1.5.0
  convention: west-bengal-butterfly
  source: https://en.wikipedia.org/wiki/List_of_butterflies_of_West_Bengal
  selection: random-at-release-time
  policy: >-
    Each v1.5.x and later release receives a release name selected at random
    from the butterfly species listed by the recorded source. The selected
    common name and scientific name SHOULD be recorded in the release notes.
release_intent: >-
  Continuous Governed Assurance has satisfied the repository qualification
  gates and is cut-ready. The release-cut change should now be mechanical:
  select the butterfly name, finalize v1.5.0 release metadata/version surfaces,
  tag, and publish without introducing new method semantics.
