name: Publish RAHP v1.5.0

on:
  push:
    branches: [main]
    paths:
      - package.json
      - PROJECT-STATUS.yaml
      - docs/releases/v1.5.0.md
      - .github/workflows/release-v1.5.0.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout qualified release commit
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify v1.5.0 release state
        shell: bash
        run: |
          set -euo pipefail
          test "$(node -p "require('./package.json').version")" = "1.5.0"
          grep -q '^stable_release: 1.5.0$' PROJECT-STATUS.yaml
          grep -q '^release_status: released$' PROJECT-STATUS.yaml
          grep -q '^qualification_status: qualified$' PROJECT-STATUS.yaml
          test -f docs/releases/v1.5.0.md

      - name: Create v1.5.0 tag and GitHub release if absent
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force
          if git rev-parse -q --verify 'refs/tags/v1.5.0' >/dev/null; then
            echo 'v1.5.0 already exists; publication is idempotently complete.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a v1.5.0 -m 'RAHP Toolkit v1.5.0 — Purple Leaf Blue'
          git push origin v1.5.0
          gh release create v1.5.0 \
            --verify-tag \
            --title 'RAHP Toolkit v1.5.0 — Purple Leaf Blue' \
            --notes-file docs/releases/v1.5.0.md
