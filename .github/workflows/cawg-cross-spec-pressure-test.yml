name: Run CAWG/C2PA cross-specification pressure test

on:
  workflow_dispatch:
    inputs:
      composition_id:
        description: CAWG/C2PA cross-specification composition
        required: true
        type: choice
        default: c2pa--cawg-portfolio
        options:
          - c2pa--cawg-portfolio
          - consent--training-data-mining
          - identity--endorsement
          - identity--governance
          - identity--metadata

permissions:
  contents: read
  issues: write

jobs:
  assess:
    uses: ./.github/workflows/cross-spec-pressure-test.yml
    with:
      registry_path: profiles/cawg/cross-spec-tests.yaml
      composition_id: ${{ inputs.composition_id }}
