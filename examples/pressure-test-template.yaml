# Use this as a starting shape for a working review under .rahp/reviews/<target>/.
# Promote a completed review into examples/<target>/ only when it is deliberately maintained
# as a curated exemplar. The YAML is canonical for that review; render its sibling Markdown view.
# Quote scalar values that contain `#` (for example, "PR #12 merged") so YAML does not
# treat the remainder as a comment.
review:
  id: SR-XXX
  status: in-progress
  title: <target specification> pressure test
  reviewed_on: YYYY-MM-DD
  target:
    repository: owner/repository
    document: https://example.org/rendered-spec/
    version: <human-readable version>
    commit: <full commit SHA>
    source_paths: []
  reviewed_against:
    repository: owner/rahp-repository
    rahp_version: v0.8.0
    corpus_date: YYYY-MM-DD
    engine_contract: rahp-engine-contract-v1
  scope:
    included: []
    excluded: []
  method:
    workflow: docs/pressure-testing-a-spec.md
  summary:
    finding_count: 1
    open_count: 1
  findings:
  - id: F-001
    title: <concise finding>
    status: open
    severity: High
    primary_disposition: specification
    scenarios: []
    scenario_patterns: []
    personas: []
    risks: [RK-XXX]
    controls: []
    guardrails: []
    assurance_tests: []
    evidence:
    - source: path/to/spec.md#section
      observation: <what the reviewed text permits, omits or contradicts>
    harm: <who can be harmed and how>
    recommendation: <actionable change at the chosen control plane>
    retest_when:
    - <observable condition that should trigger re-review>
