      - EVP-DEL-01
      - EVP-AUTH-02
      - EVP-AUTH-01
  - id: F-002
    title: Withdrawal, amendment, precedence and external permission state need a normative lifecycle
    status: open
    severity: Critical
    primary_disposition: specification
    risks:
    - CRK-06
    evidence:
    - source: https://cawg.io/consent/1.0-draft+initial-version/
      observation: The experimental proposal considers revocation, precedence and external registry pointers but
        leaves important synchronization and resolution behaviour to future work.
    harm: A consumer can continue relying on stale consent after withdrawal, or reach a different decision from
      another verifier when embedded and external states disagree.
    recommendation: Define a testable consent state machine and as-of semantics covering effective, amended, withdrawn,
      expired and superseded states; specify resolution failure and conflict handling for external state.
    retest_when:
    - Lifecycle and external-state rules are normative and covered by offline, outage, stale-cache and conflicting-state
      vectors.
    scenario_patterns:
    - SP-GOV-02
    - SP-OPS-01
    - SP-INTEROP-01
