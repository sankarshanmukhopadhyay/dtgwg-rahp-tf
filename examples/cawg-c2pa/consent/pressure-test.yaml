    revalidated_on: '2026-08-17'
    revalidation_scope: v1.1 portable assurance catalogue mapping plus method/engine revalidation; pinned target
      revision unchanged
  scope:
    included:
    - Consent authority, lifecycle, external state, precedence and withdrawal.
    excluded:
    - Implementation-specific vulnerability testing beyond normative/documented behaviour.
    - Legal opinion on whether a signal is enforceable in any jurisdiction.
  method:
    workflow: docs/pressure-testing-a-spec.md
    rule: Treat cryptographic validity, identity, authority, consent, provenance and relying-party trust as distinct
      propositions; route remediation to the narrowest effective control plane.
  summary:
    finding_count: 2
    open_count: 2
    by_primary_disposition:
      specification: 2
    overall_assessment: This is a bounded RAHP v0.6.0 readiness pressure test, not an upstream conformance certification.
      Findings focus on harms, authority/lifecycle boundaries and composition behaviour that matter when the specification
      is adopted or mandated.
  findings:
  - id: F-001
    title: Consent authority and multi-party rights are not yet sufficiently bounded for mandate use
    status: open
    severity: Critical
    primary_disposition: specification
    risks:
    - CRK-07
    evidence:
    - source: https://cawg.io/consent/1.0-draft/
      observation: The current canonical draft is an early specification skeleton, while the experimental version
        explores creator/rights-holder declarations across multiple usage domains.
    harm: A system can accept consent from a party who lacks authority, fail to account for performers or represented
      persons, or collapse multiple independent rights into one declaration.
    recommendation: Before mandate use, define actor/authority classes, representation/delegation rules, multi-party
      consent requirements, and explicit non-inference rules where the assertion cannot establish legal capacity
      or rights ownership.
    retest_when:
    - The canonical draft normatively defines consent authority and multi-party conflict cases with conformance
      tests.
    scenario_patterns:
    - SP-GOV-01
    - SP-GOV-03
    - SP-COMP-01
    personas:
