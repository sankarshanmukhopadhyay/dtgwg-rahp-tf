review:
  id: CAWG-SR-001
  status: complete
  title: CAWG Identity Assertion pressure test
  reviewed_on: '2026-08-14'
  target:
    repository: decentralized-identity/cawg-identity-assertion
    document: https://cawg.io/identity/1.3-draft/
    version: 1.3 WG-approved draft
    commit: 8a9c4925df7e8ccbcabce9d754fc27739e11dc12
    source_paths: []
  reviewed_against:
    repository: sankarshanmukhopadhyay/rahp-toolkit
    rahp_version: v0.6.0
    corpus_date: '2026-08-14'
  scope:
    included:
    - Credential-backed named-actor identity, validation status, role semantics, trust and lifecycle boundaries.
    excluded:
    - Implementation-specific vulnerability testing beyond normative/documented behaviour.
    - Legal opinion on whether a signal is enforceable in any jurisdiction.
  method:
    workflow: docs/pressure-testing-a-spec.md
    rule: Treat cryptographic validity, identity, authority, consent, provenance and relying-party trust as distinct
      propositions; route remediation to the narrowest effective control plane.
  summary:
    finding_count: 2
    open_count: 2
    by_primary_disposition:
      governance: 1
      companion-specification: 1
    overall_assessment: This is a bounded RAHP v0.6.0 readiness pressure test, not an upstream conformance certification.
      Findings focus on harms, authority/lifecycle boundaries and composition behaviour that matter when the specification
      is adopted or mandated.
  findings:
  - id: F-001
    title: Successful identity validation can be over-read as authority for the asserted role or claim
    status: open
    severity: High
    primary_disposition: governance
    risks:
    - CRK-01
    evidence:
    - source: https://cawg.io/identity/1.3-draft/
      observation: The assertion proves control of an identity credential and records named-actor roles, while relying-party
        acceptance of issuers, credentials and role authority remains a separate trust decision.
    harm: A verifier or user can treat a cryptographically valid named actor as authoritative for a domain claim,
      organization, role, or content right that the credential did not establish.
    recommendation: Define or normatively hook a relying-party governance profile that separates credential validity,
      role representation and domain-specific authority, and require UX to avoid collapsing those states.
    retest_when:
    - A normative governance/trust profile defines who is authoritative for which identity/role claims.
    scenario_patterns:
    - SP-GOV-01
    - SP-FED-01
  - id: F-002
    title: Historical identity validity and status dependencies need a durable as-of verification contract
    status: open
    severity: High
    primary_disposition: companion-specification
    risks:
    - CRK-02
    evidence:
    - source: https://cawg.io/identity/1.3-draft/
      observation: Identity validation depends on credential-specific validation mechanisms and external trust/status
        information; the portfolio also introduces archival-quality identifier concepts.
    harm: Content that was validly signed can become unverifiable or ambiguously interpreted after issuer rotation,
      credential revocation, registry loss, or policy transition.
    recommendation: Define an archival/as-of verification profile covering status-at-signing-time, issuer/key rotation
      evidence, unavailable dependencies, and the distinction between present invalidity and historical validity.
    retest_when:
    - Historical/as-of validation has normative test vectors for revocation, key rotation and unavailable authority
      sources.
    scenario_patterns:
    - SP-GOV-02
    - SP-OPS-01
    - SP-RECOV-01
    secondary_dispositions:
    - governance
