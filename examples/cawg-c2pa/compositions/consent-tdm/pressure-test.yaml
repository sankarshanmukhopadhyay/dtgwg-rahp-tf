  findings:
  - id: F-001
    title: Overlapping permission assertions lack portfolio-wide precedence
    status: open
    severity: High
    primary_disposition: specification
    risks:
    - CRK-06
    evidence:
    - source: https://github.com/decentralized-identity/cawg-identity-assertion/issues/258
      observation: CAWG is broadening consent beyond the dedicated TDM assertion, creating overlapping permission
        surfaces.
    harm: The same asset can carry contradictory machine-readable training/consent signals with no deterministic
      effective state.
    recommendation: Define explicit coexistence, supersession and conflict rules between TDM and Consent before
      mandate-grade use.
    retest_when:
    - Normative semantics and interoperable test vectors close this failure path.
