    - P5
  - id: F-002
    title: Absence must not be interpreted as permission
    status: open
    severity: High
    primary_disposition: specification
    risks:
    - CRK-12
    evidence:
    - source: https://github.com/decentralized-identity/cawg-training-and-data-mining-assertion/issues/8
      observation: The TDM issue explicitly notes missing semantics for absent assertion values.
    harm: Stripped, unsupported or missing permission assertions may be treated as affirmative permission.
    recommendation: Specify absent/unknown/unsupported semantics and require downgrade-aware verifier states.
    retest_when:
    - Normative semantics and interoperable test vectors close this failure path.
