  - id: F-002
    title: Onward agent delegation needs an explicit non-transitivity default
    status: open
    severity: High
    primary_disposition: specification
    risks:
    - CRK-25
    evidence:
    - source: https://github.com/decentralized-identity/cawg-identity-assertion/issues/236
      observation: CAWG is considering delegation for people, organizations and AI agents, but transitivity is a
        distinct authorization question.
    harm: An endorsed service or agent can pass authority to a sub-agent beyond the principal’s intent.
    recommendation: Make sub-delegation prohibited by default unless explicitly authorized with bounded scope, audience,
      actions and expiry.
    retest_when:
    - Normative semantics and interoperable test vectors close this failure path.
