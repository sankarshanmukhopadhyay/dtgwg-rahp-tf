  findings:
  - id: F-001
    title: Identity does not prove right to delegate
    status: open
    severity: High
    primary_disposition: governance
    risks:
    - CRK-08
    evidence:
    - source: https://github.com/decentralized-identity/cawg-endorsement-assertion/issues/12
      observation: The endorsement issue explicitly raises authority to assert and delegation of that authority.
    harm: A verified actor can issue an endorsement beyond their underlying authority.
    recommendation: Require delegation provenance and authority-to-delegate checks that are independent of identity
      validation.
    retest_when:
    - Normative semantics and interoperable test vectors close this failure path.
