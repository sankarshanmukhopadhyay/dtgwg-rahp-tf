  findings:
  - id: F-001
    title: Identity-valid plus registry-authorized can still be wrong at time T
    status: open
    severity: High
    primary_disposition: governance
    risks:
    - CRK-16
    evidence:
    - source: https://github.com/decentralized-identity/cawg-identity-assertion/issues/274
      observation: TRQP introduces current authorization over an identity whose credential lifecycle is independently
        validated.
    harm: Policy drift can turn the same tuple into a different authorization outcome over time.
    recommendation: Bind authorization decisions to policy/version/time evidence and test historical replay.
    retest_when:
    - Normative semantics and interoperable test vectors close this failure path.
