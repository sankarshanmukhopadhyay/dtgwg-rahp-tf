review:
  id: CAWG-COMP-001
  status: complete
  title: Identity × Governance/TRQP composition pressure test
  reviewed_on: '2026-08-14'
  target:
    repository: decentralized-identity/cawg-identity-assertion
    document: https://cawg.io/identity/1.3-draft+governance/
    version: 1.3 governance experiment
    commit: 5f1908d4f5bf6c89d02d671ae5051f893df92dc9
    source_paths: []
  reviewed_against:
    repository: sankarshanmukhopadhyay/rahp-toolkit
    rahp_version: v0.7.0
    corpus_date: '2026-08-14'
  scope:
    included:
    - Normative and draft semantics relevant to the named composition or experiment.
    - Cross-specification failure states that can remain hidden when each component is reviewed independently.
    excluded:
    - Legal opinion on enforceability in a particular jurisdiction.
    - Claims that upstream CAWG, DIF, C2PA, GLEIF or W3C endorsed this RAHP assessment.
  method:
    workflow: docs/pressure-testing-a-spec.md
    rule: Separate cryptographic validity, identity, authority, consent, lifecycle and relying-party trust; test both isolated
      and composed failure states.
  summary:
    finding_count: 2
    open_count: 2
    by_primary_disposition:
      governance: 1
      implementation-guidance: 1
    overall_assessment: 'Cross-specification RAHP review: individually valid components are tested for unsafe composed conclusions
      and downgrade behaviour.'
  findings:
  - id: F-001
    title: Identity-valid plus registry-authorized can still be wrong at time T
    status: open
    severity: High
    primary_disposition: governance
    risks:
    - CRK-16
    evidence:
    - source: https://github.com/decentralized-identity/cawg-identity-assertion/issues/274
      observation: TRQP introduces current authorization over an identity whose credential lifecycle is independently validated.
    harm: Policy drift can turn the same tuple into a different authorization outcome over time.
    recommendation: Bind authorization decisions to policy/version/time evidence and test historical replay.
    retest_when:
    - Normative semantics and interoperable test vectors close this failure path.
    scenarios:
    - CAWG-003
    - CAWG-011
    scenario_patterns:
    - SP-GOV-02
    - SP-COMP-01
  - id: F-002
    title: Registry outage must not silently downgrade to identity-only trust
    status: open
    severity: High
    primary_disposition: implementation-guidance
    risks:
    - CRK-15
    evidence:
    - source: https://github.com/decentralized-identity/cawg-identity-assertion/issues/275
      observation: TRQP adds a network-resolved authority decision after identity verification.
    harm: A validator may accept identity while dropping the higher-layer authorization check during degraded operation.
    recommendation: Define fail-closed/fail-indeterminate profiles and expose authorization-unavailable separately from identity-valid.
    retest_when:
    - Normative semantics and interoperable test vectors close this failure path.
    scenarios:
    - CAWG-009
    scenario_patterns:
    - SP-OPS-01
    - SP-COMP-01
