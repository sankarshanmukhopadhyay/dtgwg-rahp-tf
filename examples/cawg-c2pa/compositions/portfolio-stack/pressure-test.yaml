  findings:
    - id: F-001
      title: All cryptographic layers can validate while the trust decision is still unjustified
      status: open
      severity: High
      primary_disposition: implementation-guidance
      risks: [CRK-28]
      evidence:
        - source: https://cawg.io/specs/
          observation: CAWG layers identity, metadata, permission and endorsement semantics over C2PA provenance, each with distinct trust meaning.
      harm: A product can show a single success state even though provenance, identity, authority, consent and factual truth answer different questions.
      recommendation: Define a portfolio-level verifier result model and mandate UX separation of each independently evaluated proposition.
      retest_when:
        - Normative semantics and interoperable test vectors close this failure path.
      scenarios: [CAWG-024, CAWG-028]
      scenario_patterns: [SP-COMP-01, SP-INCL-01]
      personas: [P1, P2, P3, P4, P6]
      portable_assurance:
