        risk_patterns: [RKP-DEL-01, RKP-AGT-01, RKP-AUTH-01, RKP-AUTH-03]
        control_patterns: [CTP-DEL-01, CTP-AGT-01, CTP-AUTH-01, CTP-AUTH-03]
        guardrail_patterns: [GRP-DEL-01, GRP-AGT-01, GRP-AUTH-01]
        assurance_patterns: [ATP-DEL-01, ATP-AGT-01, ATP-AUTH-01]
        evidence_patterns: [EVP-DEL-01, EVP-AUTH-02, EVP-AUTH-01]
    - id: F-002
      title: Optional higher-layer assertion stripping is not distinguishable from legitimate absence
      status: open
      severity: High
      primary_disposition: companion-specification
      risks: [CRK-23]
      evidence:
        - source: https://spec.c2pa.org/specifications/specifications/2.4/index.html
          observation: C2PA provides the container/provenance substrate while CAWG gathered assertions can remain optional at the portfolio level.
      harm: Intermediaries can remove consent, endorsement or identity evidence while preserving a valid lower-layer C2PA asset.
      recommendation: Define deployment profiles that declare expected/required assertion classes and produce explicit downgrade status when missing.
      retest_when:
        - Normative semantics and interoperable test vectors close this failure path.
      scenarios: [CAWG-027]
      scenario_patterns: [SP-COMP-01, SP-REPLAY-01]
      personas: [P2, P3, P4]
