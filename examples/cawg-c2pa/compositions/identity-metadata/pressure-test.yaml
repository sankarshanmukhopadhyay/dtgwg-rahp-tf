review:
  id: CAWG-COMP-002
  status: complete
  title: Identity × Metadata composition pressure test
  reviewed_on: '2026-08-14'
  target:
    repository: decentralized-identity/cawg-metadata-assertion
    document: https://cawg.io/metadata/1.2-draft/
    version: 1.2 draft
    commit: 64069e062b6dfa1105844a773fdfd80a69356b72
    source_paths: []
  reviewed_against:
    repository: sankarshanmukhopadhyay/rahp-toolkit
    rahp_version: v0.8.0
    corpus_date: '2026-08-16'
    original_rahp_version: v0.7.0
    original_corpus_date: '2026-08-14'
    engine_contract: rahp-engine-contract-v1
    revalidated_on: '2026-08-16'
    revalidation_scope: method-and-engine-only; target revision and substantive findings unchanged
  scope:
    included:
    - Normative and draft semantics relevant to the named composition or experiment.
    - Cross-specification failure states that can remain hidden when each component is reviewed independently.
    excluded:
    - Legal opinion on enforceability in a particular jurisdiction.
    - Claims that upstream CAWG, DIF, C2PA, GLEIF or W3C endorsed this RAHP assessment.
  method:
    workflow: docs/pressure-testing-a-spec.md
    rule: Separate cryptographic validity, identity, authority, consent, lifecycle and relying-party trust; 
      test both isolated and composed failure states.
  summary:
    finding_count: 2
    open_count: 2
    by_primary_disposition:
      governance: 1
      companion-specification: 1
    overall_assessment: 'Cross-specification RAHP review: individually valid components are tested for unsafe composed
      conclusions and downgrade behaviour.'
  findings:
  - id: F-001
    title: Authenticated metadata still needs property-specific authority
    status: open
    severity: High
    primary_disposition: governance
    risks:
    - CRK-03
    evidence:
    - source: https://cawg.io/metadata/1.2-draft/
      observation: Metadata can be identity-backed without making the signer authoritative for every asserted 
        property.
    harm: Users may infer that identified signers make factually authoritative metadata claims.
    recommendation: Pair sensitive metadata namespaces with authority/governance semantics and distinct UX for
      integrity versus authoritative verification.
    retest_when:
    - Normative semantics and interoperable test vectors close this failure path.
    scenarios:
    - CAWG-024
    - CAWG-025
    scenario_patterns:
    - SP-GOV-01
    - SP-COMP-01
    personas:
    - P1
    - P2
    - P3
    - P4
  - id: F-002
    title: Conflicting identity-backed metadata needs deterministic policy
    status: open
    severity: High
    primary_disposition: companion-specification
    risks:
    - CRK-04
    evidence:
    - source: https://github.com/decentralized-identity/cawg-metadata-assertion/issues/7
      observation: Metadata quality/attestation concerns show that authenticated assertions can carry 
        uncertainty and competing claims.
    harm: Different valid actors can provide incompatible provenance or rights metadata and consumers may 
      choose arbitrarily.
    recommendation: Define precedence or multi-claim presentation semantics rather than treating later or 
      locally preferred metadata as implicitly authoritative.
    retest_when:
    - Normative semantics and interoperable test vectors close this failure path.
    scenarios:
    - CAWG-025
    scenario_patterns:
    - SP-FED-01
    - SP-COMP-01
    personas:
    - P2
    - P3
    - P4
