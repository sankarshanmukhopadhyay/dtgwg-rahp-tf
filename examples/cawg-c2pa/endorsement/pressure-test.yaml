review:
  id: CAWG-SR-005
  status: complete
  title: CAWG Endorsement Assertion pressure test
  reviewed_on: '2026-08-14'
  target:
    repository: decentralized-identity/cawg-endorsement-assertion
    document: https://cawg.io/endorsement/1.0-draft/
    version: 1.0 draft
    commit: 585c7fbe4ea49d89442ba1a8c04ab39927dbb47d
    source_paths: []
  reviewed_against:
    repository: sankarshanmukhopadhyay/rahp-toolkit
    rahp_version: v0.6.0
    corpus_date: '2026-08-14'
  scope:
    included:
    - Delegation/endorsement scope, identity binding, chaining and revocation.
    excluded:
    - Implementation-specific vulnerability testing beyond normative/documented behaviour.
    - Legal opinion on whether a signal is enforceable in any jurisdiction.
  method:
    workflow: docs/pressure-testing-a-spec.md
    rule: Treat cryptographic validity, identity, authority, consent, provenance and relying-party trust as distinct
      propositions; route remediation to the narrowest effective control plane.
  summary:
    finding_count: 2
    open_count: 2
    by_primary_disposition:
      specification: 1
      companion-specification: 1
    overall_assessment: This is a bounded RAHP v0.6.0 readiness pressure test, not an upstream conformance certification.
      Findings focus on harms, authority/lifecycle boundaries and composition behaviour that matter when the specification
      is adopted or mandated.
  findings:
  - id: F-001
    title: Endorsement can be over-read as open-ended delegation when scope and onward delegation are not explicit
    status: open
    severity: High
    primary_disposition: specification
    risks:
    - CRK-08
    evidence:
    - source: https://cawg.io/endorsement/1.0-draft/
      observation: Endorsement records approval for specific subsequent actions by another actor, creating a delegation-like
        authorization relationship.
    harm: An endorsed processor, organization or agent can be treated as authorized beyond the stated actions, or
      may delegate onward without the original endorser understanding the resulting authority chain.
    recommendation: Define explicit non-transitivity by default, bounded action/resource/time scope, onward-delegation
      rules, and validation behaviour for endorsement chains.
    retest_when:
    - Conformance vectors cover over-scope action, onward delegation and multi-hop endorsement.
    scenario_patterns:
    - SP-AGENT-01
    - SP-COMP-01
    personas:
    - P1
    - P2
    - P3
    - P5
  - id: F-002
    title: Revocation and actor identity lifecycle are not yet a complete authorization lifecycle
    status: open
    severity: High
    primary_disposition: companion-specification
    risks:
    - CRK-09
    evidence:
    - source: https://cawg.io/endorsement/1.0-draft/
      observation: The draft binds approval to actor/action relationships but depends on identity/signing and surrounding
        lifecycle machinery for continuing validity.
    harm: A previously endorsed actor can remain apparently authorized after role termination, credential compromise,
      organizational change, or explicit withdrawal of authority.
    recommendation: Bind endorsement validation to an explicit authority-status lifecycle, including revocation/expiry,
      role or credential rotation, and historical validation of actions taken while endorsement was effective.
    retest_when:
    - A validator can deterministically distinguish currently authorized, historically authorized and withdrawn
      endorsements.
    scenario_patterns:
    - SP-GOV-01
    - SP-RECOV-01
    personas:
    - P1
    - P2
    - P3
    - P5
    - P6
