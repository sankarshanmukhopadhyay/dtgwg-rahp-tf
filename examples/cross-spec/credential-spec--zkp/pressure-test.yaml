  findings:
    - id: F-001
      title: DTG Credential Specification × ZKP authority and lifecycle semantics require an explicit composition contract
      status: open
      severity: Critical
      primary_disposition: companion-specification
      secondary_dispositions: [governance, implementation-guidance]
      scenarios: [XSP-CZ-001, XSP-CZ-002]
      scenario_patterns: [SP-AUTH-02, SP-COMP-01, SP-GOV-01]
      personas: [D1]
      risks: [RK-G01]
      controls: []
      guardrails: []
      assurance_tests: []
      portable_assurance:
        harm_patterns: [HRM-SEC-02, HRM-INF-01, HRM-AUT-04, HRM-GOV-02]
        risk_patterns: [RKP-COMP-01, RKP-AUTH-02]
        control_patterns: [CTP-COMP-01, CTP-AUTH-02]
        guardrail_patterns: [GRP-COMP-01, GRP-AUTH-02]
        assurance_patterns: [ATP-COMP-01, ATP-AUTH-02]
        evidence_patterns: [EVP-COMP-01, EVP-AUTH-01]
      evidence:
        - source: corpora/credential-spec-zkp-composed.yaml#xsp-cz-001
          observation: The composed scenario exposes a failure mode that component-level validation alone cannot close.
      harm: Valid predicate proof can be treated as proof of issuer authority, allowing a verifier or runtime to infer more authority, currency or scope than either component establishes.
      recommendation: Define and test an explicit cross-spec semantic contract naming the authority owner, lifecycle check and enforcement point.
      retest_when:
        - The owning specifications or companion guidance define the semantic contract and executable negative tests.
    - id: F-002
      title: DTG Credential Specification × ZKP relying context can be lost across the specification boundary
      status: open
      severity: High
      primary_disposition: companion-specification
      secondary_dispositions: [governance, implementation-guidance]
      scenarios: [XSP-CZ-003]
      scenario_patterns: [SP-COMP-01, SP-PRIV-01]
      personas: [D1]
      risks: [RK-G01]
      controls: []
      guardrails: []
      assurance_tests: []
      portable_assurance:
        harm_patterns: [HRM-SEC-02, HRM-INF-01, HRM-AUT-04, HRM-GOV-02]
        risk_patterns: [RKP-COMP-01, RKP-AUTH-02]
        control_patterns: [CTP-COMP-01, CTP-AUTH-02]
        guardrail_patterns: [GRP-COMP-01, GRP-AUTH-02]
        assurance_patterns: [ATP-COMP-01, ATP-AUTH-02]
        evidence_patterns: [EVP-COMP-01, EVP-AUTH-01]
      evidence:
        - source: corpora/credential-spec-zkp-composed.yaml#xsp-cz-003
          observation: Selective disclosure can remove governance context needed for safe reliance.
      harm: A verifier can infer more authority, currency or scope than the disclosed proof establishes.
      recommendation: Carry the minimum provenance, purpose, audience and status context needed to distinguish verification success from an authorization or trust decision.
      retest_when:
        - The owning specifications or companion guidance define the semantic contract and executable negative tests.
    - id: F-003
      title: DTG Credential Specification × ZKP cross-context reuse can amplify privacy, replay or scope risk
      status: open
      severity: High
      primary_disposition: companion-specification
      secondary_dispositions: [governance, implementation-guidance]
      scenarios: [XSP-CZ-004]
      scenario_patterns: [SP-COMP-01, SP-REPLAY-01]
      personas: [D1]
      risks: [RK-G01]
      controls: []
      guardrails: []
      assurance_tests: []
      portable_assurance:
        harm_patterns: [HRM-SEC-02, HRM-INF-01, HRM-AUT-04, HRM-GOV-02]
        risk_patterns: [RKP-COMP-01, RKP-AUTH-02]
        control_patterns: [CTP-COMP-01, CTP-AUTH-02]
        guardrail_patterns: [GRP-COMP-01, GRP-AUTH-02]
        assurance_patterns: [ATP-COMP-01, ATP-AUTH-02]
        evidence_patterns: [EVP-COMP-01, EVP-AUTH-01]
      evidence:
        - source: corpora/credential-spec-zkp-composed.yaml#xsp-cz-004
          observation: A proof can be replayed outside the relying-party or transaction context at the composition seam.
      harm: Cross-context proof reuse can amplify privacy, replay and authorization-scope risk.
      recommendation: Add negative composition tests for cross-context reuse, correlation and scope amplification and require a fresh decision when authority or lifecycle state changes.
      retest_when:
        - The owning specifications or companion guidance define the semantic contract and executable negative tests.
  closure:
