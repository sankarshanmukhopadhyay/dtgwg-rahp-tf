      evidence:
        - source: instances/dtg/reviews/2026-08-trust-tasks.md
          observation: Trust Tasks through 2a40f6bd explicitly separates proof from role/scope authorization and strengthens lifecycle semantics, but does not define a universal cross-system delegation or mandate model.
        - source: https://github.com/trustoverip/dtgwg-zkp-tf/blob/b37d52fca4ab64ef759d4952b13757f3b23cb20b/proof-of-liveness-requirements.md
          observation: ZKP v0.3 explicitly states key control is not agent authority and models agent authorization as separate delegation evidence with scope, duration and revocation.
        - source: instances/dtg/reviews/2026-08-zkp-fork.md
          observation: Fork-local v0.4 implementation guidance further strengthens freshness, revocation and assurance boundaries but intentionally does not define a delegation protocol.
        - source: corpora/trust-tasks-zkp-composed.yaml#xsp-tz-004
          observation: The composed scenario preserves the failure case where delegated authority changes after proof generation but before consequential task execution.
      harm: >-
        A ZK proof can be cryptographically valid and fresh for its presentation transcript while the principal's mandate for the consequential Trust Task is revoked, expired, out of scope or otherwise no longer effective. Treating proof freshness as mandate freshness can therefore authorize an action neither component independently permits.
      recommendation: >-
        Define a Trust Tasks × ZKP companion contract that binds the proof request to the consequential task and requires a separate action-time delegated-authority decision covering principal, delegate, task/action, scope, constraints, validity interval and revocation state. The execution boundary must re-evaluate mandate state immediately before the side effect and must not infer authority from proof validity, holder binding or liveness/personhood predicates.
      retest_when:
        - A companion profile defines a machine-verifiable delegation/mandate reference and its binding to the Trust Task and ZKP transcript.
        - Negative tests prove that valid proof plus revoked, expired or out-of-scope delegation fails before consequential execution.
        - Replay or retry tests prove that a proof/task pair cannot repeat a one-time side effect outside the declared execution semantics.
    - id: F-002
      title: Task-specific relying context, provenance and privacy binding remains incomplete
      status: open
      severity: High
      primary_disposition: companion-specification
      secondary_dispositions:
