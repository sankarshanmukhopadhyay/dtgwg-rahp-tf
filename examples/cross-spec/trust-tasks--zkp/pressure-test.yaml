        F-002: unchanged
  scope:
    included:
      - Proof validity versus current delegated authority at task execution time.
      - Delegation scope, revocation and lifecycle state across the proof/task boundary.
      - Task-specific purpose, audience, provenance and replay binding.
      - Cross-context reuse and privacy effects created by combining proof and task metadata.
    excluded:
      - Independent implementation defects not caused or amplified by composition.
      - Treating fork-local ZKP working-draft language as ratified upstream normative text.
  method:
    workflow: docs/cross-spec-pressure-testing.md
    rule: A component-level pass does not imply a composition-level pass.
  summary:
    finding_count: 2
    open_count: 2
    overall_assessment: Trust Tasks and ZKP are individually stronger, but action-time authority/lifecycle/reuse binding and task-specific relying-context/provenance/privacy binding remain open under RAHP v1.5.0.
  findings:
    - id: F-001
      title: Action-time authority, lifecycle and reuse binding remains a cross-specification assurance gap
      status: open
      severity: Critical
      primary_disposition: companion-specification
      secondary_dispositions: [governance, implementation-guidance]
      scenarios: [XSP-TZ-001, XSP-TZ-002, XSP-TZ-004]
      scenario_patterns: [SP-AUTH-01, SP-COMP-01, SP-DEL-01, SP-GOV-01]
      personas: [D1]
      risks: [RK-G01]
      controls: []
      guardrails: []
      assurance_tests: []
      portable_assurance:
        harm_patterns: [HRM-SEC-02, HRM-INF-01, HRM-AUT-04, HRM-GOV-02]
        risk_patterns: [RKP-COMP-01, RKP-AUTH-02]
        control_patterns: [CTP-COMP-01, CTP-AUTH-02]
        guardrail_patterns: [GRP-COMP-01, GRP-AUTH-02]
        assurance_patterns: [ATP-COMP-01, ATP-AUTH-02]
        evidence_patterns: [EVP-COMP-01, EVP-AUTH-01]
      evidence:
        - source: instances/dtg/reviews/2026-08-trust-tasks.md
          observation: Trust Tasks separates proof from role/scope authorization and strengthens lifecycle semantics, but does not define a universal cross-system delegation or mandate model.
        - source: https://github.com/trustoverip/dtgwg-zkp-tf/blob/b37d52fca4ab64ef759d4952b13757f3b23cb20b/proof-of-liveness-requirements.md
          observation: ZKP v0.3 states key control is not agent authority and treats agent authorization as separate delegation evidence with scope, duration and revocation.
        - source: instances/dtg/reviews/2026-08-zkp-fork.md
          observation: Fork-local v0.4 guidance strengthens freshness and revocation boundaries but intentionally does not define a delegation protocol.
        - source: corpora/trust-tasks-zkp-composed.yaml#xsp-tz-004
          observation: Delegated authority can change after proof generation but before consequential task execution.
      harm: A proof can remain cryptographically valid while the principal's mandate is revoked, expired or out of scope, causing an unauthorized consequential action.
      recommendation: Define a companion contract that binds the proof request to the task and requires a separate action-time delegated-authority decision immediately before side effects.
      retest_when:
        - A companion profile defines a machine-verifiable mandate reference and binding to the Trust Task and ZKP transcript.
        - Negative tests prove valid proof plus revoked, expired or out-of-scope delegation fails before execution.
        - Replay/retry tests prove a proof/task pair cannot repeat a one-time effect outside declared execution semantics.
    - id: F-002
      title: Task-specific relying context, provenance and privacy binding remains incomplete
      status: open
      severity: High
      primary_disposition: companion-specification
      secondary_dispositions: [governance, implementation-guidance]
      scenarios: [XSP-TZ-003]
      scenario_patterns: [SP-COMP-01, SP-REPLAY-01]
      personas: [D1]
      risks: [RK-G01]
      controls: []
      guardrails: []
      assurance_tests: []
      portable_assurance:
        harm_patterns: [HRM-SEC-02, HRM-INF-01, HRM-AUT-04, HRM-GOV-02]
        risk_patterns: [RKP-COMP-01, RKP-AUTH-02]
        control_patterns: [CTP-COMP-01, CTP-AUTH-02]
        guardrail_patterns: [GRP-COMP-01, GRP-AUTH-02]
        assurance_patterns: [ATP-COMP-01, ATP-AUTH-02]
        evidence_patterns: [EVP-COMP-01, EVP-AUTH-01]
      evidence:
        - source: https://github.com/trustoverip/dtgwg-zkp-tf/blob/b37d52fca4ab64ef759d4952b13757f3b23cb20b/proof-of-liveness-requirements.md
          observation: ZKP v0.3 binds proofs to protocol/profile, audience, challenge, session, requested predicates, policy version and expiry boundary and defines context-dependent unlinkability.
        - source: instances/dtg/reviews/2026-08-trust-tasks.md
          observation: Trust Tasks exposes task and lifecycle semantics, but the specifications do not jointly define which task provenance and outcome facts must be committed into a privacy-preserving proof transcript.
        - source: corpora/trust-tasks-zkp-composed.yaml#xsp-tz-003
          observation: A valid proof can be reused if purpose, task instance, audience and side-effect context are not jointly bound.
      harm: A proof generated for one legitimate purpose can be replayed or upgraded into another task, while raw task identifiers can also create correlation channels.
      recommendation: Define a minimal privacy-preserving task-context commitment covering action, purpose, audience, task instance, policy/version, freshness and outcome-evidence semantics.
      retest_when:
        - A composition profile specifies the canonical task-context commitment and verifier-visible semantics.
        - Cross-task and cross-audience negative vectors reject proof reuse outside the authorized boundary.
        - Privacy vectors demonstrate provenance without an unnecessary durable cross-context correlator.
  closure:
    disposition: assessment-cycle-complete
    rationale: RAHP v1.5.0 confirms the two residual findings and records their current assurance posture without converting fork-local guidance into upstream normative authority.
