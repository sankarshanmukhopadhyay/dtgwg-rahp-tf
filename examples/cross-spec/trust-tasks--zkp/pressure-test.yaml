        harm_patterns:
          - HRM-SEC-02
          - HRM-INF-01
          - HRM-AUT-04
          - HRM-GOV-02
        risk_patterns:
          - RKP-COMP-01
          - RKP-AUTH-02
        control_patterns:
          - CTP-COMP-01
          - CTP-AUTH-02
        guardrail_patterns:
          - GRP-COMP-01
          - GRP-AUTH-02
        assurance_patterns:
          - ATP-COMP-01
          - ATP-AUTH-02
        evidence_patterns:
          - EVP-COMP-01
          - EVP-AUTH-01
      evidence:
        - source: https://github.com/trustoverip/dtgwg-zkp-tf/blob/b37d52fca4ab64ef759d4952b13757f3b23cb20b/proof-of-liveness-requirements.md
          observation: ZKP v0.3 requires transcript binding to protocol/profile, verifier or audience, challenge, session, requested predicates, policy version and expiry boundary, and defines context-dependent unlinkability rather than universal unlinkability.
        - source: instances/dtg/reviews/2026-08-trust-tasks.md
          observation: Trust Tasks now exposes explicit task and lifecycle semantics, but the specifications do not jointly define which task provenance and outcome facts must be committed into a privacy-preserving proof transcript.
        - source: corpora/trust-tasks-zkp-composed.yaml#xsp-tz-003
          observation: A valid proof can still be reused at the composition seam if the relying party cannot establish that its purpose, task instance, audience and side-effect context are the ones the prover authorized.
      harm: >-
        A proof generated for a legitimate purpose can be replayed or semantically upgraded into another Trust Task, while raw task identifiers, lifecycle metadata or retained evidence can also create correlation channels that defeat the intended ZKP privacy boundary.
      recommendation: >-
        Define the minimum task-specific commitment carried into the ZKP transcript or companion evidence: task type/action, purpose, audience, task-instance or privacy-preserving task commitment, relevant policy/version, freshness boundary and outcome-evidence semantics. Require disclosure minimization so task correlation handles are not exposed merely to prove provenance, and keep proof verification, task completion and authorization as separate machine-readable outcomes.
      retest_when:
        - A composition profile specifies the canonical task-context commitment and the verifier-visible semantics it establishes and does not establish.
        - Cross-task and cross-audience negative vectors reject proof reuse outside the authorized task/purpose boundary.
        - Privacy vectors demonstrate that provenance can be established without leaking an unnecessary durable cross-context correlator.
  closure:
    issue: 17
    disposition: reassessed-and-consolidated
    rationale: >-
      Issue #20 is complete and DTG-AR-2026-001 establishes Trust Tasks 2a40f6bd as the reviewed baseline. The ZKP side is also dispositioned through DTG-AR-2026-003 for fork-local implementation guidance, while upstream normative ZKP remains explicitly pinned at b37d52fc. The three original findings remain substantively relevant but are consolidated into two owned and retestable cross-specification obligations.
    downstream_work: >-
      Closing issue #17 records completion of the RAHP assessment cycle. It does not represent acceptance or resolution of the two residual composition risks, nor does it convert fork-local ZKP guidance into upstream normative authority.
