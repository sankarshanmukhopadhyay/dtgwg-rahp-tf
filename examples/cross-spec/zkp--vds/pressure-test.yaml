        validation alone does not establish a safe composed decision.
    harm: Revoked graph membership remains provable from stale witness state. Without an explicit composition contract, a
      verifier or runtime can infer more authority, currency or scope than either component establishes on its own.
    recommendation: Carry the minimum provenance, purpose, audience and status context needed for a relying party to distinguish
      verification success from an authorization or trust decision.
    retest_when: Re-run this composition after the owning specifications or companion guidance define the relevant semantic
      contract and executable negative tests.
