      evidence_patterns:
      - EVP-COMP-01
      - EVP-AUTH-01
    evidence:
    - source: corpora/zkp-vds-composed.yaml#xsp-zv-001
      observation: The RAHP composed scenario exposes a failure mode that can arise only at the interaction boundary; component-level
        validation alone does not establish a safe composed decision.
    harm: Graph membership proof becomes a stable correlation handle. Without an explicit composition contract, a verifier
      or runtime can infer more authority, currency or scope than either component establishes on its own.
    recommendation: Define and test an explicit cross-spec semantic contract naming the authority owner, lifecycle check and
      enforcement point for the composed decision.
    retest_when: Re-run this composition after the owning specifications or companion guidance define the relevant semantic
      contract and executable negative tests.
