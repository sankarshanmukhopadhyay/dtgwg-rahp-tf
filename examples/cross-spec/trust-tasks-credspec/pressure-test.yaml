    evidence:
    - source: corpora/trust-tasks-credspec-composed.yaml#xsp-001
      observation: The composed scenario identifies a semantic or lifecycle seam that remains unsafe even when component-level
        validation succeeds.
    harm: A context-bearing credential can be misread later as proof that a task succeeded or that a consequential
      outcome occurred.
    recommendation: Keep task context, authorization and completion as separate semantic facts and require outcome
      evidence for completion claims.
