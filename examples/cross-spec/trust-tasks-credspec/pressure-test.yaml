review:
  id: SR-XSP-001
  status: complete
  title: Trust Tasks × DTG Credential Specification cross-specification pressure test
  reviewed_on: '2026-08-22'
  target:
    repository: trustoverip/dtgwg-trust-tasks-tf + trustoverip/dtgwg-cred-spec
    version: Composition of Trust Tasks 2a40f6bd and Credentials b89f389a
    commit: 2a40f6bd3b13c85c49123174fdbe4354b3c48d81
    companion_commit: b89f389abbdae77ba60b673c0836c781c2b54169
    source_paths:
      - Trust Tasks SPEC.md and VTA lifecycle specifications
      - DTG Credential Spec spec/body.md
      - corpora/trust-tasks-credspec-composed.yaml
  reviewed_against:
    repository: sankarshanmukhopadhyay/rahp-toolkit
    rahp_version: v1.5.0
    engine_contract: rahp-engine-contract-v1
    evidence_retention_contract: rahp-evidence-retention-v1
    normalized_result_schema: '1'
    reassessed_on: '2026-08-22'
  lineage:
    prior_rahp_version: v1.2
    prior_record: history/pre-v1.5.yaml
    transition: reassessed
    evidence_freshness: retained
  assurance:
    residual_state: finding
    policy_gate: FAIL
    gate_reason: One Critical and two High cross-specification obligations remain unresolved.
    assurance_delta:
      disposition: retained
      summary: The v1.2 consolidation remains substantively valid; v1.5 makes current posture, evidence freshness and finding lineage explicit.
      finding_lineage:
        F-001: unchanged
        F-002: unchanged
        F-003: unchanged
  scope:
    included:
      - Authority and delegation at the Trust Task + credential seam.
      - Execution/outcome binding, replay and idempotency.
      - Lifecycle skew across task, credential, registry and policy state.
      - Privacy composition across task, credential, transport and error evidence.
      - Cross-boundary redress and contestability.
    excluded:
      - Independent implementation defects not caused or amplified by specification composition.
  method:
    workflow: docs/cross-spec-pressure-testing.md
    rule: A component-level pass does not imply a composition-level pass.
  summary:
    finding_count: 3
    open_count: 3
    overall_assessment: The composition is materially stronger than its earlier baseline, but authority/lifecycle, execution/replay, and privacy/contestability remain open assurance seams under RAHP v1.5.0.
  findings:
    - id: F-001
      title: Authority and lifecycle coherence remains a cross-specification assurance gap
      status: open
      severity: Critical
      primary_disposition: companion-specification
      secondary_dispositions: [governance, implementation-guidance]
      scenarios: [XSP-002, XSP-007, XSP-009, XSP-010]
      scenario_patterns: [SP-AUTH-02, SP-DEL-01, SP-DEL-02, SP-OPS-01, SP-OPS-02, SP-COMP-02]
      personas: [P1, P3, P5, P6]
      risks: [RK-AI01]
      controls: []
      guardrails: []
      assurance_tests: []
      portable_assurance:
        harm_patterns: [HRM-AUT-04, HRM-SEC-02, HRM-INF-01, HRM-AUT-05]
        risk_patterns: [RKP-COMP-01, RKP-AUTH-02, RKP-COMP-02]
        control_patterns: [CTP-COMP-01, CTP-AUTH-02, CTP-COMP-02]
        guardrail_patterns: [GRP-COMP-01, GRP-AUTH-02]
        assurance_patterns: [ATP-COMP-01, ATP-AUTH-02, ATP-COMP-02]
        evidence_patterns: [EVP-COMP-01, EVP-AUTH-01]
      evidence:
        - source: instances/dtg/reviews/2026-08-trust-tasks.md
          observation: Trust Tasks separates proof from role/scope authorization and strengthens lifecycle semantics, but does not define a universal cross-system delegation model or synchronized credential/status policy.
        - source: corpora/trust-tasks-credspec-composed.yaml#xsp-002
          observation: Individually valid task and credential facts can still be combined beyond a principal's current mandate unless delegated authority is evaluated at action time.
      harm: A consumer can execute a consequential task using valid component evidence while relying on stale, revoked or out-of-scope delegated authority.
      recommendation: Define a cross-spec authority and lifecycle contract carrying bounded delegation, authority scope, status-as-of evidence, revocation semantics and safe-degradation rules, evaluated at consequential execution time.
      retest_when:
        - A companion profile or normative specification defines current delegated-authority verification across Trust Tasks and credentials.
        - The profile defines lifecycle synchronization, offline status-as-of semantics and safe degradation.
    - id: F-002
      title: Execution, outcome binding and replay remain incompletely composed
      status: open
      severity: High
      primary_disposition: companion-specification
      secondary_dispositions: [implementation-guidance]
      scenarios: [XSP-001, XSP-003]
      scenario_patterns: [SP-COMP-01, SP-REPLAY-01]
      personas: [P1, P3, P5, P6]
      risks: [RK-EX05]
      controls: []
      guardrails: []
      assurance_tests: []
      portable_assurance:
        harm_patterns: [HRM-INF-01, HRM-SEC-02, HRM-ECO-02]
        risk_patterns: [RKP-CRD-03, RKP-OPS-02]
        control_patterns: [CTP-CRD-01, CTP-OPS-02]
        guardrail_patterns: [GRP-OPS-01]
        assurance_patterns: [ATP-COMP-01, ATP-OPS-02]
        evidence_patterns: [EVP-COMP-01, EVP-OPS-02]
      evidence:
        - source: https://github.com/trustoverip/dtgwg-cred-spec/commit/b89f389abbdae77ba60b673c0836c781c2b54169
          observation: The VWC digest strengthens edge binding but does not itself prove task completion or one-time execution.
        - source: corpora/trust-tasks-credspec-composed.yaml#xsp-003
          observation: A valid credential and valid task can still be replayed together unless freshness, task identity, credential use and side-effect execution are bound.
      harm: A credential can be correctly bound to an edge yet still be misinterpreted as proof of successful task completion or reused to repeat a one-time effect.
      recommendation: Define a cross-spec execution contract separating task context, authority, completion and outcome evidence, with freshness and idempotency semantics.
      retest_when:
        - A normative profile defines outcome evidence and one-time or idempotent execution binding across the specifications.
    - id: F-003
      title: Privacy composition and contestability remain cross-boundary governance obligations
      status: open
      severity: High
      primary_disposition: governance
      secondary_dispositions: [companion-specification, implementation-guidance]
      scenarios: [XSP-005, XSP-006, XSP-011, XSP-012]
      scenario_patterns: [SP-PRIV-01, SP-PRIV-02, SP-COMP-01, SP-GOV-03, SP-RED-01]
      personas: [P1, P3, P5, P6]
      risks: [RK-EX05]
      controls: []
      guardrails: []
      assurance_tests: []
      portable_assurance:
        harm_patterns: [HRM-PRV-02, HRM-PRV-05, HRM-GOV-02, HRM-ECO-02]
        risk_patterns: [RKP-COMP-03, RKP-GOV-04]
        control_patterns: [CTP-PRV-02, CTP-GOV-03]
        guardrail_patterns: [GRP-PRV-01, GRP-RED-01]
        assurance_patterns: [ATP-PRV-01, ATP-RED-01]
        evidence_patterns: [EVP-PRV-01, EVP-RED-01]
      evidence:
        - source: instances/dtg/reviews/2026-08-trust-tasks.md
          observation: VTA lifecycle and discovery surfaces improve explicitness but add observable artifacts whose combined privacy impact is not bounded by either component specification alone.
        - source: corpora/trust-tasks-credspec-composed.yaml#xsp-012
          observation: Adverse outcomes can span task policy, credential status and registry governance without a single accountable contestability boundary.
      harm: Minimal component disclosures can compose into durable correlation while an affected person lacks a single evidence package and accountable contest path.
      recommendation: Require composed disclosure analysis and a cross-boundary evidence and responsibility contract for recipient scoping, retention, explanation, accountable authority and remedy routing.
      retest_when:
        - A privacy profile bounds disclosure and correlation across the composed exchange.
        - A governance profile defines the accountable decision owner, evidence package and contest/remedy path.
  closure:
    disposition: assessment-cycle-complete
    rationale: RAHP v1.5.0 confirms the three residual findings and records their current assurance posture without treating assessment completion as risk resolution.
