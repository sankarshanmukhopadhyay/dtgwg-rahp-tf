review:
  id: SR-XSP-001
  status: complete
  title: Trust Tasks × DTG Credential Specification cross-specification pressure test
  reviewed_on: '2026-08-17'
  target:
    repository: trustoverip/dtgwg-trust-tasks-tf + trustoverip/dtgwg-cred-spec
    version: Composition of Trust Tasks fbe196a8 and Credentials WD01 d19f7c9
    commit: fbe196a8a17ba3f99d0657a64be5ac58621023a1
    source_paths:
    - Trust Tasks SPEC.md
    - DTG Credential Spec spec/body.md
    - corpora/trust-tasks-credspec-composed.yaml
  reviewed_against:
    repository: sankarshanmukhopadhyay/rahp-toolkit
    rahp_version: v1.1.0
    corpus_date: '2026-08-17'
    engine_contract: rahp-engine-contract-v1
  scope:
    included:
    - Authority, credential context, replay, privacy composition, lifecycle skew and cross-boundary redress at the
      seam between Trust Tasks and the DTG Credential Specification.
    excluded:
    - Independent implementation defects not caused or amplified by specification composition.
  method:
    workflow: docs/cross-spec-pressure-testing.md
    rule: A component-level pass does not imply a composition-level pass.
  summary:
    finding_count: 6
    open_count: 6
    overall_assessment: 'The composition remains a first-class assurance surface: independently valid task, credential,
      registry and policy facts can still combine into unauthorized, stale, replayed, privacy-invasive or unappealable
      outcomes unless their semantic and lifecycle contracts are explicit.'
  findings:
  - id: F-001
    title: Credential validity and task authentication do not establish current delegated authority
    status: open
    severity: Critical
    primary_disposition: companion-specification
    secondary_dispositions:
    - governance
    - implementation-guidance
    scenarios:
    - XSP-002
    - XSP-007
    scenario_patterns:
