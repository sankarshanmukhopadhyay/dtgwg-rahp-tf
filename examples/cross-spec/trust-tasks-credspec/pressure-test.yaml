    controls: []
    guardrails: []
    assurance_tests: []
    portable_assurance:
      harm_patterns:
      - HRM-AUT-04
      - HRM-SEC-02
      - HRM-INF-01
      - HRM-AUT-05
      risk_patterns:
      - RKP-COMP-01
      - RKP-AUTH-02
      control_patterns:
      - CTP-COMP-01
      - CTP-AUTH-02
      guardrail_patterns:
      - GRP-COMP-01
      - GRP-AUTH-02
      assurance_patterns:
      - ATP-COMP-01
      - ATP-AUTH-02
      evidence_patterns:
      - EVP-COMP-01
      - EVP-AUTH-01
    evidence:
    - source: corpora/trust-tasks-credspec-composed.yaml#xsp-002
      observation: The composed scenario identifies a semantic or lifecycle seam that remains unsafe even when component-level
        validation succeeds.
    harm: A consumer can combine individually valid task and credential facts and still perform an action beyond
      the principal’s current mandate.
    recommendation: Define an explicit cross-spec authority contract that carries a bounded delegation reference
      and requires action-time evaluation of current authority.
    retest_when:
    - The two specifications or an adopted companion profile define and test the relevant cross-spec semantic contract.
