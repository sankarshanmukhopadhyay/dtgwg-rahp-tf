    examples/security-hardening/trust-tasks/findings.yaml:
    - finding: SEC-TT-001
      classification: resolved
      evidence: "\xA77.2 item 11 requires duplicate-execution suppression keyed to document id plus content digest."
    - finding: SEC-TT-002
      classification: resolved
      evidence: Consequential tasks without an enforceable acceptance window may no longer execute.
    - finding: SEC-TT-003
      classification: resolved
      evidence: "\xA79.1.1 requires any proof-omission allowance to be justified by an explicit binding security\
        \ profile; silence is not permission."
    - finding: SEC-TT-004
      classification: weakened
      evidence: "\xA77.2 item 10 prevents identity/VID equivalence from being silently treated as authorization,\
        \ but deployment-specific VID equivalence remains possible."
    - finding: SEC-TT-005
      classification: weakened
      evidence: Unrecognized extension namespaces remain non-actionable and consumers can require/publish named
        ext namespaces, reducing but not eliminating ecosystem semantic skew.
    - finding: SEC-TT-006
      classification: unchanged
    - finding: SEC-TT-007
      classification: unchanged
    - finding: SEC-TT-008
      classification: weakened
      evidence: Transport binding security profiles are clearer, but discovery still lacks complete secure-profile
        negotiation.
    - finding: SEC-TT-009
      classification: weakened
      evidence: Authorization evaluation is now mandatory for consequential tasks, but the framework intentionally
        leaves the authorization model and policy content to deployments.
    - finding: SEC-TT-010
      classification: resolved
      evidence: "\xA77.2 item 12 requires re-evaluation of required authority/credential conditions immediately\
        \ before irreversible effects."
    - finding: SEC-TT-011
      classification: unchanged
    - finding: SEC-TT-012
      classification: unchanged
    - finding: SEC-TT-013
      classification: unchanged
