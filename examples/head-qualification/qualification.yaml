        Spec explicitly distinguishes credential validity from Trust Task artifacts.
    - finding: SEC-X-003
      classification: unchanged
    - finding: SEC-X-004
      classification: weakened
      evidence: Exact document replay is suppressed by Trust Tasks item 11; semantically duplicate fresh issuance
        requests remain task-specific.
    - finding: SEC-X-005
      classification: weakened
      evidence: Trust Tasks item 12 re-evaluates authority and status before irreversible effects, reducing the
        approval-to-issuance gap.
    - finding: SEC-X-006
      classification: weakened
      evidence: Outstanding task effects now re-evaluate authority, but already-issued credential lifecycle remains
        independently governed.
    - finding: SEC-X-007
      classification: resolved
      evidence: Both specifications now explicitly separate ceremony/task completion evidence from durable credential
        validity, with Trust Task receipts/citations available for the former.
    - finding: SEC-X-008
      classification: unchanged
    - finding: SEC-X-009
      classification: unchanged
    - finding: SEC-X-010
      classification: weakened
      evidence: New task-control dispositions, task errors and acknowledgement semantics improve durable state reporting
        but do not define every task-specific issuance failure bridge.
    - finding: SEC-X-011
      classification: unchanged
    - finding: SEC-X-012
      classification: weakened
      evidence: Trust Tasks now forbids identity/proof from being treated as authorization; accountable human/control
        relationships remain outside syntactic role satisfaction.
