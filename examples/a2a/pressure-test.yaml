review:
  id: SR-A2A-001
  status: complete
  title: Agent2Agent (A2A) Protocol v1.0.0 RAHP pressure test
  reviewed_on: '2026-08-14'
  target:
    repository: a2aproject/A2A
    document: https://a2a-protocol.org/v1.0.0/specification/
    version: 1.0.0
    commit: 1eb4aa03b07589d3a00ce7deab0dde679120ed30
    source_paths:
    - docs/specification.md
    - docs/topics/agent-discovery.md
    - docs/topics/enterprise-ready.md
    - docs/topics/streaming-and-async.md
    - docs/whats-new-v1.md
  reviewed_against:
    repository: sankarshanmukhopadhyay/rahp-toolkit
    rahp_version: v0.7.0+a2a-example
    corpus_date: '2026-08-14'
  scope:
    included:
    - Agent discovery and Agent Card trust semantics
    - Authentication and authorization boundaries
    - Multi-agent delegation and downstream actions
    - Secondary credentials used during tasks
    - Long-running tasks, streaming and push notifications
    - Observability and cross-agent accountability
    excluded:
    - Source-code audit of A2A SDK implementations
    - Cryptographic review of JWS, TLS or OAuth primitives
    - Governance assessment of any specific public agent registry
    - Conformance testing of a particular deployed agent
  method:
    workflow: docs/pressure-testing-a-spec.md
    rule: Credit controls already present in A2A v1.0; add a new RAHP risk only where the reusable catalogue
      lacks the cross-agent trust boundary.
  summary:
    finding_count: 6
    open_count: 6
    by_primary_disposition:
      specification: 1
      implementation-guidance: 2
      companion-specification: 2
      governance: 1
    overall_assessment: A2A v1.0.0 has substantial protocol security foundations, including signed Agent Cards,
      authorization scoping, secure transport expectations and detailed push-notification guidance. The principal
      RAHP gaps are not basic transport-security omissions. They are trust-semantics and delegated-authority
      boundaries that emerge when independently operated agents discover one another, subcontract work, obtain
      secondary credentials and act asynchronously.
  findings:
  - id: F-001
    title: A signed Agent Card can still be over-read as proof of authority or trust
    status: open
    severity: High
    primary_disposition: specification
    secondary_dispositions:
    - implementation-guidance
    - governance
    risks:
    - RK-AI05
    controls:
    - CT-68
    guardrails:
    - GR-22
    assurance_tests:
    - AT-22
    evidence:
    - source: docs/topics/agent-discovery.md#the-role-of-the-agent-card
      observation: The Agent Card advertises identity/provider information, service endpoints, capabilities,
        authentication requirements and skills, and clients use it to determine suitability.
    - source: docs/whats-new-v1.md#enterprise-ready-features
      observation: A2A v1.0 adds JWS plus JSON Canonicalization for Agent Card signature verification, improving
        integrity and authenticity of the published metadata.
    harm: A client may correctly verify who signed an Agent Card yet incorrectly infer that the signer is authorised
      for the requested action, accountable to the principal, certified to a particular assurance level, or
      entitled to exercise every advertised skill.
    recommendation: 'Add an explicit semantic non-inference rule: Agent Card integrity, identity/provider metadata,
      skills and capabilities describe an endpoint but do not by themselves establish delegated authority,
      operator accountability, assurance level or permission. Require those decisions to be made by the applicable
      authorization and trust policy.'
    retest_when:
    - The specification or normative security guidance explicitly separates signed capability advertisement
      from authority and trust decisions.
  - id: F-002
    title: Discovery trust and freshness remain deployment-governed across well-known, registry and direct
      modes
    status: open
    severity: High
    primary_disposition: governance
    secondary_dispositions:
    - implementation-guidance
    risks:
    - RK-AI06
    controls:
    - CT-67
    guardrails:
    - GR-22
    assurance_tests:
    - AT-22
    evidence:
    - source: docs/topics/agent-discovery.md#discovery-strategies
      observation: A2A describes well-known URI, curated registry and direct/private discovery strategies;
        it states that the current specification does not prescribe a standard API for curated registries.
    - source: docs/topics/agent-discovery.md#caching-considerations
      observation: Agent Cards are cacheable and clients may apply a reasonable default cache duration when
        servers provide no caching headers.
    harm: Two conforming deployments can apply materially different trust, registry-governance and freshness
      assumptions. A valid but stale or incorrectly trusted card can route a task to an obsolete endpoint or
      preserve outdated capabilities and security requirements.
    recommendation: Document a deployment trust profile that identifies accepted discovery authorities, signature/origin
      validation, cache/freshness bounds, withdrawal behavior and registry governance. Keep the registry API
      out of core A2A if desired, but make the relying-party trust decision explicit and testable.
    retest_when:
    - A reusable discovery trust profile or equivalent implementation/governance guidance defines origin, freshness
      and registry trust requirements.
  - id: F-003
    title: A2A task delegation does not by itself preserve the originating principal’s authority envelope across
      agent hops
    status: open
    severity: High
    primary_disposition: companion-specification
    secondary_dispositions:
    - implementation-guidance
    risks:
    - RK-AI07
    - RK-AI01
    controls:
    - CT-30
    - CT-52
    - CT-69
    - CT-73
    guardrails:
    - GR-12
    - GR-13
    - GR-23
    assurance_tests:
    - AT-12
    - AT-13
    - AT-23
    evidence:
    - source: docs/specification.md#11-key-goals-of-a2a
      observation: A2A explicitly supports collaboration and delegation between independent agents while preserving
        opaque execution.
    - source: docs/topics/enterprise-ready.md#authorization
      observation: Authorization is the A2A server’s responsibility and is specific to the agent implementation,
        data, backend resources and enterprise policy.
    harm: An upstream agent can be authorised to perform a bounded task while a downstream agent sees only
      a technically valid request. Purpose, human approval conditions, resource limits, expiry, revocation
      and permitted delegation depth can be lost between hops.
    recommendation: Define or normatively reference a delegation-context profile/extension that can bind an
      A2A task to the originating principal and a bounded authority envelope. Preserve capability, purpose,
      resource scope, approvals, validity, revocation and delegation depth across downstream calls without
      requiring disclosure of private reasoning.
    retest_when:
    - A2A or a companion profile defines interoperable delegation-context propagation and negative tests for
      excess downstream authority.
  - id: F-004
    title: Out-of-band secondary credentials need an explicit non-transitivity boundary
    status: open
    severity: High
    primary_disposition: companion-specification
    secondary_dispositions:
    - implementation-guidance
    risks:
    - RK-AI09
    - RK-AI01
    controls:
    - CT-30
    - CT-72
    guardrails:
    - GR-12
    - GR-25
    assurance_tests:
    - AT-25
    evidence:
    - source: docs/topics/enterprise-ready.md#authentication
      observation: When an agent needs credentials for a different system during a task, the client obtains
        those credentials out of band and provides them to the A2A server to continue the task.
    - source: docs/topics/enterprise-ready.md#authorization
      observation: The remote agent is responsible for enforcing authorization before sensitive backend actions
        and is instructed to apply least privilege.
    harm: A secondary credential can be technically valid yet broader than the task’s delegated authority.
      Without audience, purpose and delegation-depth binding, credential possession can be mistaken for permission
      to forward, exchange or reuse it with additional downstream agents.
    recommendation: Define a companion credential/delegation profile or implementation contract requiring audience,
      resource, purpose, lifetime and delegation-depth restrictions for secondary credentials, with an explicit
      rule that credentials are non-transitive unless the principal authorised onward delegation.
    retest_when:
    - Secondary-credential guidance includes task/delegation binding and negative confused-deputy or token-forwarding
      tests.
  - id: F-005
    title: Push notification security is well identified but requires deployment-level assurance evidence
    status: open
    severity: High
    primary_disposition: implementation-guidance
    risks:
    - RK-AI08
    controls:
    - CT-70
    - CT-71
    guardrails:
    - GR-24
    assurance_tests:
    - AT-24
    evidence:
    - source: docs/topics/streaming-and-async.md#security-considerations-for-push-notifications
      observation: A2A warns against blindly trusting client-supplied webhook URLs because of SSRF and DDoS
        risks, and recommends allowlisting, ownership verification and egress controls.
    - source: docs/topics/streaming-and-async.md#client-webhook-receiver-security-when-receiving-notifications-from-a2a-server
      observation: The guidance requires authenticating the A2A server and discusses timestamps, unique IDs
        and key rotation to mitigate replay and impersonation.
    harm: An implementation can advertise push support while failing to prove that callback destinations, sender
      identity, task binding, freshness and replay controls work under adversarial conditions.
    recommendation: Add a deployment assurance checklist/test profile covering prohibited callback destinations,
      destination ownership where applicable, authenticated sender identity, task/audience binding, expiry/freshness
      and replay rejection. Treat this primarily as implementation assurance, not a new wire-format requirement
      unless testing reveals an interoperability gap.
    retest_when:
    - A2A implementation/conformance guidance includes callback SSRF, authentication, task-binding, freshness
      and replay negative vectors.
  - id: F-006
    title: Opaque execution needs portable cross-agent action provenance without exposing private reasoning
    status: open
    severity: Medium
    primary_disposition: implementation-guidance
    secondary_dispositions:
    - governance
    risks:
    - RK-AI07
    controls:
    - CT-73
    guardrails:
    - GR-13
    - GR-23
    assurance_tests:
    - AT-23
    evidence:
    - source: docs/topics/enterprise-ready.md#tracing-observability-and-monitoring
      observation: A2A recommends distributed tracing, comprehensive task/correlation logging and auditing
        of significant agent actions.
    - source: docs/specification.md#12-guiding-principles
      observation: A2A intentionally permits opaque execution so agents need not expose internal thoughts,
        plans, memory or tool implementations.
    harm: A multi-agent workflow can be operationally observable yet still lack evidence showing which principal
      authorised which agent, what scope was active, which approval boundary applied and which downstream action
      produced a material effect.
    recommendation: 'Define a portable action-provenance profile for externally consequential events: principal
      or accountable operator reference, agent identity, task/context IDs, delegation reference, action category,
      approval checkpoint, timestamp, downstream target and outcome. Do not require model chain-of-thought
      or private internal reasoning.'
    retest_when:
    - A2A implementation guidance or an extension profile defines reconstructable cross-agent action provenance
      independent of private model reasoning.
