  reviews:
  - rahp
  - security
  - combined
- id: cawg-training-data-mining
  repository: decentralized-identity/cawg-training-and-data-mining-assertion
  branch: main
  document: https://cawg.io/training-and-data-mining/1.1/
  version: '1.1'
  context:
    title: CAWG Training and Data Mining Assertion
    type: ratified-specification
  scope:
    include:
    - README.md
    - '**/*.adoc'
    - '**/*.json'
  reviews:
