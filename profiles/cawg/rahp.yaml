  context:
    title: CAWG User Experience Guidance
    type: ratified-guidance
  scope:
    include:
    - README.md
    - '**/*.adoc'
    - '**/*.md'
  reviews:
  - rahp
  - security
  - combined
- id: c2pa-specifications
  repository: c2pa-org/specifications
  branch: main
  document: https://spec.c2pa.org/specifications/specifications/2.4/index.html
  version: tracked main branch
  context:
    title: C2PA Technical Specification
    type: foundation-specification
  scope:
    include:
    - README.md
    - specifications/**
    - '**/*.md'
    - '**/*.adoc'
    - '**/*.json'
    - '**/*.cddl'
  reviews:
  - rahp
  - security
  - combined
output:
  directory: build/targets/cawg
governance:
  namespace: cawg-external-assessment
  authority_boundary: Findings are RAHP assessment artefacts only. CAWG, DIF and C2PA retain authority over their
    respective specifications, releases and governance decisions.
