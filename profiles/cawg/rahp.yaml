version: 1
profile:
  id: cawg-c2pa
  title: CAWG/C2PA specification assurance deployment
  description: 'External RAHP deployment covering the CAWG assertion/profile portfolio and the C2PA technical specification
    on which those assertions depend. The deployment is observational: upstream projects retain specification and
    governance authority.'
  owner: RAHP external assessment instance
assessment:
  default_mode: combined
  rahp_repository: sankarshanmukhopadhyay/rahp-toolkit
  rahp_version: v1.0.0
  retention:
    workspace_directory: .rahp
    ephemeral_days: 14
    referenced_days: 365
    allow_sensitive_git_evidence: false
repositories:
- id: cawg-identity
  repository: decentralized-identity/cawg-identity-assertion
  branch: main
  document: https://cawg.io/identity/1.3-draft/
  version: 1.3 working-group-approved draft
  context:
    title: CAWG Identity Assertion
    type: normative-specification
  scope:
    include:
    - README.md
    - '**/*.adoc'
    - '**/*.json'
    - .github/workflows/**
  reviews:
  - rahp
  - security
  - combined
- id: cawg-identity-governance
  repository: decentralized-identity/cawg-identity-assertion
  branch: governance
  document: https://cawg.io/identity/1.3-draft+governance/
  version: 1.3 governance experiment
  context:
    title: CAWG Identity Assertion governance experiment
    type: experimental-specification
  scope:
    include:
    - README.md
    - '**/*.adoc'
    - '**/*.json'
  reviews:
  - rahp
  - security
  - combined
- id: cawg-identity-vc-vp
  repository: decentralized-identity/cawg-identity-assertion
  branch: w3c-vc-credential-support
  document: https://cawg.io/identity/1.3-draft+vc-vp/
  version: 1.3 VC/VP experiment
  context:
    title: CAWG Identity Assertion VC/VP experiment
    type: experimental-specification
  scope:
    include:
    - README.md
    - '**/*.adoc'
    - '**/*.json'
  reviews:
  - rahp
  - security
  - combined
- id: cawg-identity-vlei
  repository: decentralized-identity/cawg-identity-assertion
  branch: vlei
  document: https://cawg.io/identity/1.3-draft+vlei/
  version: 1.3 vLEI experiment
  context:
    title: CAWG Identity Assertion vLEI experiment
    type: experimental-specification
  scope:
    include:
    - README.md
    - '**/*.adoc'
    - '**/*.json'
  reviews:
  - rahp
  - security
  - combined
- id: cawg-metadata
  repository: decentralized-identity/cawg-metadata-assertion
  branch: main
  document: https://cawg.io/metadata/1.2-draft/
  version: 1.2 draft
  context:
    title: CAWG Metadata Assertion
    type: normative-specification
  scope:
    include:
    - README.md
