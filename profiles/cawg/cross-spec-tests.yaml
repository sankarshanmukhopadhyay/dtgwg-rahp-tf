    - assessment-required
    - cawg-instance
    - cross-specification
  description: >-
    Optional external RAHP profile for CAWG/C2PA composition testing. It is
    independent of the DTG example profile and does not load DTG execution metadata.
issue_repository: sankarshanmukhopadhyay/rahp-toolkit
purpose: >-
  Profile-owned cross-specification seams for the existing CAWG/C2PA worked
  assessments. Upstream projects retain specification and governance authority.
