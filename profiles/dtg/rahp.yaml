version: 1
profile:
  id: dtg
  title: DTG Working Group RAHP deployment
  description: Current checked-in DTG deployment snapshot. Operational automation refreshes instances/dtg/generated/repositories.yaml
    from the DTG Portfolio Monitor and relevant forks.
  owner: DTG RAHP instance
assessment:
  default_mode: combined
  rahp_repository: sankarshanmukhopadhyay/rahp-toolkit
  rahp_version: v0.9.0
  retention:
    workspace_directory: .rahp
    ephemeral_days: 14
    referenced_days: 365
    allow_sensitive_git_evidence: false
repositories:
- id: trustoverip-dtgwg-trust-tasks-tf
  repository: trustoverip/dtgwg-trust-tasks-tf
  branch: main
  context:
    title: trustoverip/dtgwg-trust-tasks-tf
    type: protocol-and-task-specification
    description: DTG portfolio target; workstream=trust-tasks; lifecycle=active; reporting_weight=critical.
  scope:
    include: &id001
    - README.md
    - docs/**
    - specs/**
    - schemas/**
    - '**/*spec*.md'
    - .github/workflows/**
  reviews:
  - rahp
  - security
  - combined
- id: trustoverip-dtgwg-htx-tf
